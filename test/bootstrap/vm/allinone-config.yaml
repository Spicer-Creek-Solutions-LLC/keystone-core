vm_provider: ssh

ssh:
  clean_nodes: false
  nodes:
    - name: cp1
      host: 192.168.1.100
      port: 22
      user: root
      key_file: ~/.ssh/id_rsa
      os: ubuntu-22.04
      role: control-plane
    - name: agent-web-1
      host: 192.168.1.110
      port: 22
      user: root
      key_file: ~/.ssh/id_rsa
      os: ubuntu-22.04
      role: agent
    - name: agent-web-2
      host: 192.168.1.111
      port: 22
      user: root
      key_file: ~/.ssh/id_rsa
      os: debian-12
      role: agent
    - name: agent-db-1
      host: 192.168.1.112
      port: 22
      user: root
      key_file: ~/.ssh/id_rsa
      os: rocky-9
      role: agent
