# Docker Compose for Keystone Core E2E Testing
# Topology: All-in-One (embedded NATS + SQLite + multiple agents)
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml down -v
#
# For Podman:
#   podman-compose -f docker-compose.yml up -d

# Default logging configuration to prevent log explosion
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Default resource limits to prevent resource exhaustion
x-resources: &default-resources
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"
      reservations:
        memory: 128M

services:
  # Control Plane Server with embedded NATS and SQLite
  server:
    build:
      context: ../../..
      dockerfile: test/e2e/containers/Dockerfile.server
    image: kscore-server:e2e-test
    container_name: kscore-server
    hostname: server
    ports:
      - "8080:8080"   # gRPC API
      - "8081:8081"   # HTTP API / Health
      - "8082:8082"   # Webhook receiver
      - "4222:4222"   # NATS (for agents to connect)
    volumes:
      - server-data:/var/lib/keystone-core
    environment:
      # Use info level by default; set KSCORE_LOG_LEVEL=debug for debugging
      - KSCORE_LOG_LEVEL=${KSCORE_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      - kscore-net

  # Agent 1 - Web server role
  agent-web-1:
    build:
      context: ../../..
      dockerfile: test/e2e/containers/Dockerfile.agent
    image: kscore-agent:e2e-test
    container_name: kscore-agent-web-1
    hostname: agent-web-1
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config/agent-web-1.yaml:/etc/keystone-core/agent.yaml:ro
    logging: *default-logging
    <<: *default-resources
    networks:
      - kscore-net

  # Agent 2 - Web server role
  agent-web-2:
    image: kscore-agent:e2e-test
    container_name: kscore-agent-web-2
    hostname: agent-web-2
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config/agent-web-2.yaml:/etc/keystone-core/agent.yaml:ro
    logging: *default-logging
    <<: *default-resources
    networks:
      - kscore-net

  # Agent 3 - Database server role
  agent-db-1:
    image: kscore-agent:e2e-test
    container_name: kscore-agent-db-1
    hostname: agent-db-1
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config/agent-db-1.yaml:/etc/keystone-core/agent.yaml:ro
    logging: *default-logging
    <<: *default-resources
    networks:
      - kscore-net

networks:
  kscore-net:
    driver: bridge

volumes:
  server-data:
