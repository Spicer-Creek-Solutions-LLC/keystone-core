# Agent configuration for agent-web-2
nats:
  mode: external
  url: "nats://server:4222"
  maxreconnects: 30
  reconnectwait: 2s
  jetstream:
    storedir: ""

agent:
  id: "agent-web-2"
  heartbeatinterval: 5s
  commandtimeout: 60s
  metadatainterval: 30s

tls:
  enabled: false

auth:
  enabled: false
