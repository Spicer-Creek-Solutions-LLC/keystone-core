# Agent configuration for agent-web-1
nats:
  mode: external
  url: "nats://server:4222"
  maxreconnects: 30
  reconnectwait: 2s
  jetstream:
    storedir: ""

agent:
  id: "agent-web-1"
  heartbeatinterval: 5s
  commandtimeout: 60s
  metadatainterval: 30s
  # Labels are set via agent metadata in code

tls:
  enabled: false

auth:
  enabled: false
