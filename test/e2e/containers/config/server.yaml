# Keystone Core Server Configuration for E2E Tests
# This configuration runs the server in embedded mode for testing

server:
  listenaddr: "0.0.0.0"
  grpcport: 8080
  httpport: 8081
  allowinsecurenonloopback: true

# NATS configuration - embedded mode for all-in-one testing
nats:
  mode: embedded
  embedded:
    host: "0.0.0.0"
    port: 4222
    enablejetstream: true
    storedir: "/var/lib/kscore/nats"
    maxmemory: 268435456  # 256MB for testing
    maxconnections: 100
  jetstream:
    enabled: true
    storedir: "/var/lib/kscore/jetstream"
    maxstorage: 1073741824  # 1GB for testing
  maxreconnects: 10
  reconnectwait: 1s

# Storage configuration - SQLite for testing
storage:
  backend: sqlite
  sqlite:
    path: "/var/lib/kscore/kscore.db"
    wal: true
    busytimeout: 5000

# TLS disabled for testing
tls:
  enabled: false

# Auth disabled for E2E testing
auth:
  enabled: false

# Webhook receiver for GitOps integration testing
webhook:
  enabled: true
  port: 8082
  path: /webhooks
  authtype: none
  handlers:
    - argocd
    - flux
    - github
    - gitlab

# Policy engine for policy enforcement testing
policy:
  enabled: true
  engine: both
  enforcementmode: enforce
  policies:
    # Security policy - OPA (Rego)
    - id: security-no-root-commands
      name: No Root Commands
      description: Blocks commands that require root privileges
      type: opa
      category: security
      severity: high
      enabled: true
      code: |
        package keystone.security

        default allow = true

        # Block dangerous commands
        deny[msg] {
          input.command == "rm"
          contains(input.args[_], "-rf")
          contains(input.args[_], "/")
          msg := "Recursive deletion of root paths is not allowed"
        }

    # Compliance policy - CEL
    - id: compliance-agent-targeting
      name: Agent Targeting Validation
      description: Ensures commands target specific agents, not wildcards in production
      type: cel
      category: compliance
      severity: medium
      enabled: true
      code: |
        resource.target != "*" || context.environment != "production"

    # Operational policy - OPA (Rego)
    - id: operational-command-audit
      name: Command Audit
      description: Logs all command executions for audit trail
      type: opa
      category: operational
      severity: low
      enabled: true
      code: |
        package keystone.operational

        default allow = true

        # All commands are allowed but logged
        audit[msg] {
          msg := sprintf("Command executed: %s on agent %s", [input.command, input.agent_id])
        }
