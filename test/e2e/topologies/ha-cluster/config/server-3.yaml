# Keystone Core Server Configuration - HA Cluster Node 3

server:
  listenaddr: "0.0.0.0"
  grpcport: 8080
  httpport: 8081
  allowinsecurenonloopback: true

nats:
  mode: external
  url: "nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222"
  maxreconnects: 30
  reconnectwait: 2s
  jetstream:
    enabled: true
    storedir: "/var/lib/keystone-core/jetstream"

storage:
  backend: postgresql
  postgresql:
    # kics-scan ignore-line - Test fixture, not a production secret
    dsn: "postgres://kscore:kscore_e2e_password@postgres:5432/kscore?sslmode=disable"
    maxopenconns: 20
    maxidleconns: 10
    connmaxlifetime: 1h

cluster:
  enabled: true
  nodeid: server-3
  etcd:
    endpoints:
      - "http://etcd-1:2379"
      - "http://etcd-2:2379"
      - "http://etcd-3:2379"
    dialtimeout: 5s
    requesttimeout: 10s
  heartbeatinterval: 5s
  electiontimeout: 15s
  leasettl: 30

auth:
  enabled: false

tls:
  enabled: false
