# Keystone Core Server Configuration - HA Cluster Node 1
# This configuration uses external NATS cluster and PostgreSQL

server:
  listenaddr: "0.0.0.0"
  grpcport: 8080
  httpport: 8081

# NATS configuration - external cluster mode
nats:
  mode: external
  url: "nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222"
  maxreconnects: 30
  reconnectwait: 2s
  jetstream:
    enabled: true

# Storage configuration - PostgreSQL
storage:
  backend: postgres
  postgres:
    host: postgres
    port: 5432
    user: kscore
    password: kscore_e2e_password
    database: kscore
    sslmode: disable
    maxopenconns: 20
    maxidleconns: 10
    connmaxlifetime: 1h

# Cluster configuration
cluster:
  enabled: true
  nodeid: server-1
  etcd:
    endpoints:
      - "http://etcd-1:2379"
      - "http://etcd-2:2379"
      - "http://etcd-3:2379"
    dialtimeout: 5s
    requesttimeout: 10s
  heartbeatinterval: 5s
  electiontimeout: 15s
  leasettl: 30

# TLS disabled for testing
tls:
  enabled: false
