# NATS Configuration for HA Cluster E2E Testing

# Server port
port: 4222

# HTTP monitoring port
http_port: 8222

# JetStream configuration
jetstream {
    store_dir: "/data/jetstream"
    max_memory_store: 256MB
    max_file_store: 1GB
}

# Cluster configuration
cluster {
    port: 6222

    # Allow route connections from any IP
    no_advertise: false
}

# Logging
debug: false
trace: false
logtime: true

# Limits
max_connections: 1000
max_subscriptions: 0
max_control_line: 4KB
max_payload: 1MB

# Timeouts
ping_interval: 2s
ping_max: 3

# Write deadline
write_deadline: 10s
