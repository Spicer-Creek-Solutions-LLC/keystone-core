# Docker Compose for Keystone Core IPv6 E2E Testing
# Topology: IPv6-only network with control plane and agents
#
# Prerequisites:
#   - Docker with IPv6 support enabled in daemon.json
#   - IPv6 networking configured on host
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml down -v
#
# Note: Docker IPv6 requires the daemon to be configured with:
#   {
#     "ipv6": true,
#     "fixed-cidr-v6": "fd00::/64"
#   }
#
# For testing without daemon changes, this uses a user-defined bridge
# network with IPv6 enabled.

# Default logging configuration to prevent log explosion
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Default resource limits to prevent resource exhaustion
x-resources: &default-resources
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"
      reservations:
        memory: 128M

services:
  # Control Plane Server with embedded NATS and SQLite (IPv6)
  server:
    build:
      context: ../../../..
      dockerfile: test/e2e/containers/Dockerfile.server
    image: kscore-server:e2e-ipv6
    container_name: kscore-server-ipv6
    hostname: server
    ports:
      - "[::1]:18080:8080"   # gRPC API (IPv6 localhost)
      - "[::1]:18081:8081"   # HTTP API / Health
      - "[::1]:18082:8082"   # Webhook receiver
      - "[::1]:14222:4222"   # NATS
    volumes:
      - server-data:/var/lib/kscore
      - ./config/server.yaml:/etc/kscore/server.yaml:ro
    environment:
      - KSCORE_LOG_LEVEL=${KSCORE_LOG_LEVEL:-info}
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://[::1]:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      kscore-ipv6:
        ipv6_address: fd00:kscore::10

  # Agent 1 - Web server role (IPv6)
  agent-web-1:
    build:
      context: ../../../..
      dockerfile: test/e2e/containers/Dockerfile.agent
    image: kscore-agent:e2e-ipv6
    container_name: kscore-agent-ipv6-web-1
    hostname: agent-web-1
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config/agent-web-1.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    logging: *default-logging
    <<: *default-resources
    networks:
      kscore-ipv6:
        ipv6_address: fd00:kscore::20

  # Agent 2 - Web server role (IPv6)
  agent-web-2:
    build:
      context: ../../../..
      dockerfile: test/e2e/containers/Dockerfile.agent
    image: kscore-agent:e2e-ipv6
    container_name: kscore-agent-ipv6-web-2
    hostname: agent-web-2
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config/agent-web-2.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    logging: *default-logging
    <<: *default-resources
    networks:
      kscore-ipv6:
        ipv6_address: fd00:kscore::21

  # Agent 3 - Database server role (IPv6)
  agent-db-1:
    build:
      context: ../../../..
      dockerfile: test/e2e/containers/Dockerfile.agent
    image: kscore-agent:e2e-ipv6
    container_name: kscore-agent-ipv6-db-1
    hostname: agent-db-1
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config/agent-db-1.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    logging: *default-logging
    <<: *default-resources
    networks:
      kscore-ipv6:
        ipv6_address: fd00:kscore::30

networks:
  kscore-ipv6:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        # IPv6 ULA (Unique Local Address) range for testing
        # fd00:kscore::/64 - private IPv6 range
        - subnet: fd00:kscore::/64
          gateway: fd00:kscore::1

volumes:
  server-data:
