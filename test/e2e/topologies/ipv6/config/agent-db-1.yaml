# Agent configuration for agent-db-1 (IPv6)
nats:
  mode: external
  # Connect to server via IPv6 address
  url: "nats://[fd00:1::10]:4222"
  maxreconnects: 30
  reconnectwait: 2s
  jetstream:
    storedir: "/var/lib/kscore/jetstream"

agent:
  id: "agent-ipv6-db-1"
  heartbeatinterval: 5s
  commandtimeout: 60s
  metadatainterval: 30s
  address_family: ipv6_only
  labels:
    role: database
    environment: test
    network: ipv6

tls:
  enabled: false

auth:
  enabled: false
