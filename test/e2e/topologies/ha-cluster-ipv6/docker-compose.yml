# Docker Compose for Keystone Core HA Cluster E2E Testing over IPv6
# Topology: HA Cluster (3 control planes + NATS cluster + PostgreSQL + etcd) on IPv6-only network
#
# Prerequisites:
#   - Docker with IPv6 support enabled
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml down -v

# Default logging configuration to prevent log explosion
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Default resource limits for lightweight services
x-resources-light: &resources-light
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.5"

# Default resource limits for standard services
x-resources-standard: &resources-standard
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"

# Default resource limits for heavy services (control plane, databases)
x-resources-heavy: &resources-heavy
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: "2.0"

services:
  # ==========================================================================
  # NATS Cluster (3 nodes) - IPv6
  # ==========================================================================
  nats-1:
    image: nats:2.10-alpine
    container_name: kscore-ha-ipv6-nats-1
    hostname: nats-1
    command: >
      -c /etc/nats/nats.conf
      --name nats-1
      --cluster_name kscore-ha-ipv6-cluster
      --cluster nats://[::]:6222
      --routes nats://[fd00:2::12]:6222,nats://[fd00:2::13]:6222
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - nats-1-data:/data
    ports:
      # Host-facing ports use IPv4 for test harness compatibility
      - "127.0.0.1:4222:4222"
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::11
    logging: *default-logging
    <<: *resources-light
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://[::1]:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nats-2:
    image: nats:2.10-alpine
    container_name: kscore-ha-ipv6-nats-2
    hostname: nats-2
    command: >
      -c /etc/nats/nats.conf
      --name nats-2
      --cluster_name kscore-ha-ipv6-cluster
      --cluster nats://[::]:6222
      --routes nats://[fd00:2::11]:6222,nats://[fd00:2::13]:6222
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - nats-2-data:/data
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::12
    logging: *default-logging
    <<: *resources-light
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://[::1]:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nats-3:
    image: nats:2.10-alpine
    container_name: kscore-ha-ipv6-nats-3
    hostname: nats-3
    command: >
      -c /etc/nats/nats.conf
      --name nats-3
      --cluster_name kscore-ha-ipv6-cluster
      --cluster nats://[::]:6222
      --routes nats://[fd00:2::11]:6222,nats://[fd00:2::12]:6222
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - nats-3-data:/data
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::13
    logging: *default-logging
    <<: *resources-light
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://[::1]:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ==========================================================================
  # etcd Cluster (3 nodes) for leader election - IPv6
  # ==========================================================================
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: kscore-ha-ipv6-etcd-1
    hostname: etcd-1
    environment:
      - ETCD_NAME=etcd-1
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://[::]:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://[fd00:2::21]:2379
      - ETCD_LISTEN_PEER_URLS=http://[::]:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://[fd00:2::21]:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://[fd00:2::21]:2380,etcd-2=http://[fd00:2::22]:2380,etcd-3=http://[fd00:2::23]:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=kscore-ha-ipv6-etcd-cluster
    volumes:
      - etcd-1-data:/etcd-data
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::21
    logging: *default-logging
    <<: *resources-light
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: kscore-ha-ipv6-etcd-2
    hostname: etcd-2
    environment:
      - ETCD_NAME=etcd-2
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://[::]:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://[fd00:2::22]:2379
      - ETCD_LISTEN_PEER_URLS=http://[::]:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://[fd00:2::22]:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://[fd00:2::21]:2380,etcd-2=http://[fd00:2::22]:2380,etcd-3=http://[fd00:2::23]:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=kscore-ha-ipv6-etcd-cluster
    volumes:
      - etcd-2-data:/etcd-data
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::22
    logging: *default-logging
    <<: *resources-light
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: kscore-ha-ipv6-etcd-3
    hostname: etcd-3
    environment:
      - ETCD_NAME=etcd-3
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://[::]:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://[fd00:2::23]:2379
      - ETCD_LISTEN_PEER_URLS=http://[::]:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://[fd00:2::23]:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://[fd00:2::21]:2380,etcd-2=http://[fd00:2::22]:2380,etcd-3=http://[fd00:2::23]:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=kscore-ha-ipv6-etcd-cluster
    volumes:
      - etcd-3-data:/etcd-data
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::23
    logging: *default-logging
    <<: *resources-light
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==========================================================================
  # PostgreSQL (primary) - IPv6
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kscore-ha-ipv6-postgres
    hostname: postgres
    environment:
      - POSTGRES_USER=kscore
      # kics-scan ignore-line - Test fixture, not a production secret
      - POSTGRES_PASSWORD=kscore_e2e_password
      - POSTGRES_DB=kscore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::30
    logging: *default-logging
    <<: *resources-standard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kscore -d kscore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==========================================================================
  # Control Plane Cluster (3 nodes) - IPv6
  # ==========================================================================
  server-1:
    build:
      context: ../../../..
      dockerfile: test/e2e/containers/Dockerfile.server
    image: kscore-server:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-server-1
    hostname: server-1
    depends_on:
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      # Host-facing ports use IPv4 for test harness compatibility
      - "127.0.0.1:8080:8080"   # gRPC API
      - "127.0.0.1:8081:8081"   # HTTP API / Health
    volumes:
      - ./config/server-1.yaml:/etc/kscore/server.yaml:ro
      - server-1-data:/var/lib/kscore
    environment:
      - KSCORE_LOG_LEVEL=${KSCORE_LOG_LEVEL:-info}
      - KSCORE_CLUSTER_NODE_ID=server-1
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::101
    logging: *default-logging
    <<: *resources-heavy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://[::1]:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  server-2:
    image: kscore-server:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-server-2
    hostname: server-2
    depends_on:
      server-1:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"   # gRPC API
      - "127.0.0.1:8083:8081"   # HTTP API
    volumes:
      - ./config/server-2.yaml:/etc/kscore/server.yaml:ro
      - server-2-data:/var/lib/kscore
    environment:
      - KSCORE_LOG_LEVEL=${KSCORE_LOG_LEVEL:-info}
      - KSCORE_CLUSTER_NODE_ID=server-2
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::102
    logging: *default-logging
    <<: *resources-heavy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://[::1]:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  server-3:
    image: kscore-server:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-server-3
    hostname: server-3
    depends_on:
      server-1:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8080"   # gRPC API
      - "127.0.0.1:8085:8081"   # HTTP API
    volumes:
      - ./config/server-3.yaml:/etc/kscore/server.yaml:ro
      - server-3-data:/var/lib/kscore
    environment:
      - KSCORE_LOG_LEVEL=${KSCORE_LOG_LEVEL:-info}
      - KSCORE_CLUSTER_NODE_ID=server-3
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::103
    logging: *default-logging
    <<: *resources-heavy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://[::1]:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ==========================================================================
  # Agents (5 agents for HA IPv6 testing)
  # ==========================================================================
  agent-1:
    build:
      context: ../../../..
      dockerfile: test/e2e/containers/Dockerfile.agent
    image: kscore-agent:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-agent-1
    hostname: agent-1
    depends_on:
      server-1:
        condition: service_healthy
    volumes:
      - ./config/agent.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_AGENT_ID=agent-ha-ipv6-1
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::201
    logging: *default-logging
    <<: *resources-light

  agent-2:
    image: kscore-agent:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-agent-2
    hostname: agent-2
    depends_on:
      server-1:
        condition: service_healthy
    volumes:
      - ./config/agent.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_AGENT_ID=agent-ha-ipv6-2
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::202
    logging: *default-logging
    <<: *resources-light

  agent-3:
    image: kscore-agent:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-agent-3
    hostname: agent-3
    depends_on:
      server-1:
        condition: service_healthy
    volumes:
      - ./config/agent.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_AGENT_ID=agent-ha-ipv6-3
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::203
    logging: *default-logging
    <<: *resources-light

  agent-4:
    image: kscore-agent:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-agent-4
    hostname: agent-4
    depends_on:
      server-1:
        condition: service_healthy
    volumes:
      - ./config/agent.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_AGENT_ID=agent-ha-ipv6-4
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::204
    logging: *default-logging
    <<: *resources-light

  agent-5:
    image: kscore-agent:e2e-ha-ipv6
    container_name: kscore-ha-ipv6-agent-5
    hostname: agent-5
    depends_on:
      server-1:
        condition: service_healthy
    volumes:
      - ./config/agent.yaml:/etc/kscore/agent.yaml:ro
    environment:
      - KSCORE_AGENT_ID=agent-ha-ipv6-5
      - KSCORE_ADDRESS_FAMILY=ipv6_only
    networks:
      kscore-ha-ipv6:
        ipv6_address: fd00:2::205
    logging: *default-logging
    <<: *resources-light

networks:
  kscore-ha-ipv6:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        # IPv6 ULA (Unique Local Address) range for testing
        # fd00:2::/64 - private IPv6 range (different from IPv6-only topology)
        - subnet: fd00:2::/64
          gateway: fd00:2::1

volumes:
  nats-1-data:
  nats-2-data:
  nats-3-data:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  postgres-data:
  server-1-data:
  server-2-data:
  server-3-data:
