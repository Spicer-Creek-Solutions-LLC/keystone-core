# Epic 08 task 13 Layer C — minimal smoke fixture for the
# cross-distro harness. Same module set as the in-process
# integration test (file / link / cmd / config) so the matrix
# exercises the YAML loader + runner pipeline without needing the
# distro's package manager or init system.
#
# ${ROOT} is substituted to /work/tmp by smoke.sh before kscorectl
# applies this file. Keep this list small — heavy module coverage
# is the job of the per-distro test step the v0.5 ROADMAP entry
# adds; smoke is just "does the binary run end-to-end here."

metadata:
  name: kscore-cross-distro-smoke
  version: "0.1"

file:
  ${ROOT}/smoke-dir:
    state: directory
    mode: "0755"
  ${ROOT}/smoke-dir/hello.txt:
    state: present
    content: "cross-distro smoke ok\n"
    mode: "0644"
    require:
      - file: ${ROOT}/smoke-dir
