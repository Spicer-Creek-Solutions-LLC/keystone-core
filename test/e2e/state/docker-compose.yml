# Epic 08 task 13 Layer C — cross-distro state stdlib smoke matrix.
#
# v0.5 acceptance: one service per distro (debian-12, ubuntu-22-04,
# ubuntu-24-04, rocky-9, alpine-3-19). v0.1 scaffolds the harness
# with `debian-12` only; the rest are TODO entries tracked under
# docs/project/ROADMAP.md "Cross-distro state stdlib docker matrix
# harness".
#
# Each service:
#   - mounts the repo read-only at /src
#   - runs smoke.sh, which builds kscore-server + kscorectl in a
#     scratch /work dir and exercises smoke.yaml
#   - exports KSCORE_DISTRO so smoke.sh can branch where init /
#     package-manager semantics differ
#
# All services share a no-net network — the smoke is fully local;
# no apt mirrors / npm registries / git remotes are reached.

services:
  debian-12:
    image: golang:1.23-bookworm
    container_name: kscore-e2e-debian-12
    working_dir: /src
    environment:
      KSCORE_DISTRO: debian-12
      KSCORE_PKG_MGR: apt
      KSCORE_INIT: systemd
      CGO_ENABLED: "1"
    volumes:
      - ${PWD}/../../..:/src:ro
      - kscore-debian-12-work:/work
    # `tini` is built into the golang image's entrypoint shim; we
    # invoke bash explicitly for predictable signalling.
    command: ["bash", "/src/test/e2e/state/smoke.sh"]

  # ubuntu-22-04:
  #   image: golang:1.23-jammy
  #   ... (v0.5 — not yet wired)

  # ubuntu-24-04:
  #   image: golang:1.23-noble
  #   ... (v0.5 — not yet wired)

  # rocky-9:
  #   image: rockylinux:9
  #   # needs explicit Go install (rockylinux:9 doesn't ship Go);
  #   # Dockerfile.rocky-9 (TODO) layers golang on top.
  #   ... (v0.5 — not yet wired)

  # alpine-3-19:
  #   image: golang:1.23-alpine3.19
  #   environment:
  #     KSCORE_DISTRO: alpine-3-19
  #     KSCORE_PKG_MGR: apk
  #     KSCORE_INIT: openrc
  #   ... (v0.5 — not yet wired)

volumes:
  kscore-debian-12-work:
