# Epic 08 cross-distro matrix — systemd-distro smoke fixture
# (Debian 12, Ubuntu 22.04/24.04, Rocky 9).
#
# Applied twice by the in-container harness (test/e2e/state/harness):
# the first pass converges, the second must report zero changes
# (idempotency). It exercises the modules whose behaviour varies
# across distros — package (apt/dnf) and service (systemd) — alongside
# the cross-distro-stable file module, plus user/group (shadow-utils on
# the systemd distros, BusyBox adduser/addgroup on Alpine) and hostname
# (hostnamectl). smoke.sh detaches Docker's /etc/hostname bind-mount
# first so the hostname is settable (see the comment there).
#
# Placeholders substituted by smoke.sh before apply:
#   ${ROOT} → a writable scratch dir
#   ${PKG}  → the distro's name for a small package that ships a
#             service (cron on Debian/Ubuntu, cronie on Rocky)
#   ${SVC}  → that package's service unit (cron / crond)

metadata:
  name: kscore-cross-distro-smoke-systemd
  version: "0.1"

file:
  ${ROOT}/smoke-dir:
    state: directory
    mode: "0755"
  ${ROOT}/smoke-dir/hello.txt:
    state: present
    content: "cross-distro smoke ok\n"
    mode: "0644"
    require:
      - file: ${ROOT}/smoke-dir

package:
  ${PKG}:
    state: installed

service:
  ${SVC}:
    state: running
    enable: true
    require:
      - package: ${PKG}

# A system group + system user (primary group = the group). No home or
# shell is declared so there is no cross-distro path drift; the user
# requires the group so it is created first. Routes to shadow-utils on
# the systemd distros and BusyBox adduser/addgroup on Alpine.
group:
  ksmoke:
    state: present
    system: true

user:
  ksmoke:
    state: present
    system: true
    group: ksmoke
    require:
      - group: ksmoke

# The declared hostname is the key. Routes to hostnamectl on the systemd
# distros. The container starts with a hex-ID hostname, so the first
# apply changes /etc/hostname and the second is a zero-change no-op.
hostname:
  ksmoke-host: {}
