# Epic 19 task 1 — kscore-server config for the single-topology E2E.
#
# Scope: dev-mode boot against external Postgres + external NATS, no
# TLS. Identity IS enabled (see below) so bootstrap issues per-agent
# SVIDs; that is what the agent secret-lookup scenario needs.

mode: development

server:
  host: 0.0.0.0
  grpcport: 5397
  httpport: 8080
  tls:
    enabled: false

logging:
  level: info
  format: json

storage:
  driver: postgres
  dsn: postgres://kscore:kscore@postgres:5432/kscore?sslmode=disable

health:
  startupgraceperiod: 30s
  checktimeout: 2s

nats:
  mode: external
  urls: ["nats://nats:4222"]
  jetstream:
    enabled: true
    storedir: /data/jetstream
    # Per-stream limits, small on purpose. The production defaults are
    # 10 GiB / 1,000,000 msgs per stream (internal/config/config.go), and
    # DefaultStreamDefs creates TWO streams, so an E2E run inheriting
    # them asks JetStream for 20 GiB of budget. The embedded/containered
    # NATS derives its budget from free disk, so the run passed or failed
    # on how much space the machine happened to have — the COMMANDS
    # stream would be created and the EVENTS stream would then fail with
    # "insufficient storage resources available". The scenarios move a
    # few dozen small messages; 64 MiB is ample, and any plausible
    # derived budget covers two streams of that size.
    #
    # Bounding the SERVER's budget instead is not an option: it breaks
    # agent connectivity outright. See the comment in
    # scaffold_native_test.go for the measurements.
    streammaxbytes: 67108864
    streammaxmsgs: 100000
  bootstrap:
    enabled: true
    psks:
      - agentid: agent-1
        secret: "11111111111111111111111111111111"
        expiresat: 2099-01-01T00:00:00Z
      - agentid: agent-2
        secret: "22222222222222222222222222222222"
        expiresat: 2099-01-01T00:00:00Z

# Identity is ON so bootstrap issues each agent an X509 SVID. That is
# what lets the control plane tell WHICH agent is asking for a secret,
# which the fleet-wide HMAC key cannot. TLS stays off: enabling
# identity does not turn on the TLS listener (server.tls.enabled does),
# so every plaintext scenario is unaffected.
identity:
  enabled: true
  trust_domain: kscore.local
  storage_path: /data/identity

security:
  hmacsecret: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
  defaultpolicy: allow

# Epic 19 task 2b — enable the encrypted-file secrets backend so the
# E2E scenario 6 can exercise KV round-trips. Lease + transit are
# Vault-only (see internal/secrets/file/backend.go:370+, transit.go:13)
# and stay deferred to a v1.x Vault-backed E2E.
secrets:
  enabled: true
  default_backend: file
  backends:
    - name: file
      type: encrypted_file
      file:
        path: /data/secrets
        master_key: "inline:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  # Which agent may read which secret path. Server-side by design: an
  # agent that declared its own grants would be granting itself.
  # agent-1 only, so the scenario can also assert agent-2 is refused.
  agent_grants:
    - agent_ids: ["agent-1"]
      paths: ["kv/e2e/agent/"]

# Epic 19 task 2b — point BlueprintService at the e2e blueprint
# catalog (mounted from test/e2e/single/blueprints/). Server-side
# apply only; remote-fleet dispatch is the gate-v1.0 ROADMAP item
# "Remote / distributed blueprint apply wiring".
blueprints:
  catalogpath: /blueprints

metrics:
  enabled: true
  path: /metrics

# Epic 19 task 2c — outbound webhook subsystem. Subscribes to the
# events bus and POSTs each matching event to configured subscriptions.
webhook:
  outbound:
    enabled: true
    max_retries: 3
    retry_backoff: 100ms
    timeout: 5s
    max_payload_size: 1048576
    delivery_retention: 1h
    max_concurrent_deliveries: 8
    refresh_interval: 30s

# Epic 19 task 2c — GitOps inbound webhook receiver (own :8081
# listener) + rollback engine. Both light up under webhook.enabled.
# Real K8s rollout-undo executor + ArgoCD-server-backed executor stay
# deferred (see ROADMAP gate-v1.0 entries). Git-revert is registered.
gitops:
  webhook:
    enabled: true
    addr: ":8081"
    path: /webhooks
    max_body_bytes: 1048576
    sources:
      github:
        method: hmac
        secret: "epic-19-task-2c-github-hmac-secret"
