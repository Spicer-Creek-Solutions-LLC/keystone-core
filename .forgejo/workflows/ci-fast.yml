# CI for Forgejo Actions — runs on Codeberg's hosted runner pool,
# which advertises the `docker` label.
#
# This is the per-PR fast feedback loop. Heavy jobs that don't add
# signal on every PR (release-dry-run, the 5 non-host cross-build
# variants) live in ci-full.yml, which runs on push-to-main +
# nightly cron + workflow_dispatch only.
#
# Filename note: this file is `ci-fast.yml` (was `ci.yml`) so that
# Forgejo Actions' lexical workflow-file enumeration picks it BEFORE
# `ci-full.yml` (`fast` sorts before `full` alphabetically). On a
# push-to-main run both workflows fire; the runner picks them in
# directory-listing order. Having `ci-fast` run first means the
# `lint` cache warmer is populated by the time `ci-full`'s heavy
# jobs (release-dry-run, the 5 build variants) start, so they
# benefit from the warm cache instead of cold-missing. See the
# `name:` field below — it's still `ci`, so the UI's "Checks"
# display on PRs is unchanged.
#
# All work runs through Make targets per PROJECT-DETAILS §5.4:
# "CI never runs raw `go test`/`go build` — always Make targets."
#
# The GitHub mirror is code-only — no CI runs there.
#
# Go cache strategy: `setup-go`'s built-in cache is disabled everywhere
# (`cache: false`). `lint` runs an explicit `actions/cache@v4` step
# (the sole writer for the workflow); every other Go job runs
# `actions/cache/restore@v4` (read-only). This eliminates the
# per-job `tar -cf cache.tgz -z` save step (4-6 min on Codeberg's
# shared runner) from every job except `lint`. `openapi` + `docs`
# have no Go code and skip the cache entirely.
#
# Security: every ${{ ... }} expansion below references either matrix
# values defined in this file or github.ref (a refname, not user
# content). No issue/PR/commit body text is interpolated into shell.

name: ci

# Email the run's author when their push/PR run fails (or recovers from
# a previous failure). Failure/recovery only — green runs send nothing.
# The heavier unattended coverage lives in ci-full.yml's nightly cron.
enable-email-notifications: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` (multi-threaded zstd, ~500
      # MB/s) instead of single-threaded `tar -z` (gzip, ~30-50 MB/s).
      # For a 2GB cache that's seconds-not-minutes. Idempotent.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      # Cache warmer: write the go module + build cache for the workflow.
      # Other jobs restore from this via actions/cache/restore@v4. See
      # header comment for the warmer/reader rationale.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      # Build golangci-lint with the runner's Go toolchain so the binary's
      # build-time Go version matches go.mod's `go` directive. Avoids the
      # "Go language version (goX.Y) used to build golangci-lint is lower
      # than the targeted Go version" error from prebuilt binaries.
      - run: make install-tools
      - run: make lint
      # Epic 19 task 5 — race-detector policy lint. Every `go test`
      # in the Makefile + scripts/smoke-test.sh must include -race
      # unless its target is on the allowList in tools/racegate/
      # main.go (currently only `slo`, for wall-clock SLO accuracy).
      # Per docs/project/TEST-POLICY.md.
      - run: make race-policy
      # Epic 19 task 6 — goleak policy lint. Every package with a
      # //go:build integration test file must have a TestMain wrapping
      # goleakhelper.VerifyTestMain. Allowlist exceptions documented
      # inline in tools/goleakgate/main.go with GRADUATE-BY notes.
      - run: make goleak-policy
      # Epic 19 task 9 — auto-generated reference docs sync check.
      # The CLI / configuration / API reference docs are regenerated
      # from sources (cmd/*/--help, internal/config/*.go,
      # api/proto/*.proto + api/openapi/openapi-spec.yaml) by
      # `make docs-sync`. CI fails if a PR landed a source change
      # without re-running the generator.
      - run: make docs-sync-check
      # Promo-video shot list. Same contract as docs-sync-check: the
      # generated title cards under assets/promo/tapes/ must match what
      # `make update-promo` would produce from the current branch, and
      # the shot list must stay inside its 30s runtime budget. Also
      # reports any changelog fragment tagged `Demo:` that no shot
      # covers. Pure Go — the render half (vhs/ttyd/ffmpeg) is not a
      # CI dependency. See assets/promo/README.md.
      - run: make promo-check
      # Build-artifact discipline lint. Catches PRs that committed
      # binaries from ad-hoc `go build ./cmd/foo` runs at repo root.
      # `make build` writes to build/bin/$GOOS/$GOARCH/ — anything
      # else means the Makefile was bypassed.
      # See docs/project/DEVELOPMENT.md "Build artifact discipline".
      - run: make clean-check
      # Markdown link-health check (Phase A3 of the public-launch
      # checklist). lychee against every .md file in offline mode
      # so the gate is deterministic; external URLs are checked
      # via the separate `make docs-links-online` target (not in CI).
      - run: make docs-links
      # Build the Hugo documentation site (Hextra) and link-check the
      # rendered output. Gates that the site builds from the canonical
      # Markdown AND that its rendered links resolve on every PR.
      # install-hugo pulls a pinned Hugo Extended; docs-links-site fetches
      # the Hextra theme (docs/go.mod), renders to docs/public/, and runs
      # lychee offline over the result. See the "Hugo docs site" ROADMAP.
      - run: make install-hugo
      - run: make docs-links-site

  # DCO sign-off gate. Every non-merge commit on a PR must carry a
  # `Signed-off-by:` trailer per docs/project/DCO.md + AGENTS.md § 4.
  # PR-only: direct pushes to `main` are already blocked by branch
  # protection, and a DCO miss on an already-merged commit can't be
  # retroactively fixed. Lenient v0.1.x policy — any well-formed
  # trailer counts; trailer-email-matches-author-email tightening
  # is deferred (see docs/project/ROADMAP.md).
  dco-check:
    runs-on: docker
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # PR head SHA (not the synthesized merge ref) so we lint
          # the contributor's actual commits. fetch-depth: 0 so both
          # BASE_SHA and HEAD_SHA are reachable for `git log A..B`.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: verify Signed-off-by trailer on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=()
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" \
                 | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              missing+=("$sha")
            fi
          done < <(git log --no-merges --format=%H "$BASE_SHA..$HEAD_SHA")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::DCO check failed: ${#missing[@]} commit(s) missing 'Signed-off-by:' trailer"
            echo
            echo "See docs/project/DCO.md. To fix:"
            echo "  git commit --amend --signoff       # last commit"
            echo "  git rebase --signoff <base>        # a range"
            echo
            for sha in "${missing[@]}"; do
              echo "  - $(git log -1 --format='%h %s' "$sha")"
            done
            exit 1
          fi
          total=$(git rev-list --no-merges --count "$BASE_SHA..$HEAD_SHA")
          echo "DCO check passed: all ${total} non-merge commit(s) carry a Signed-off-by trailer."

  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: test (race + coverage)
        run: make test-coverage
      # Epic 19 task 4 — per-package coverage gate. Critical >=70%,
      # CLI >=40%. Allowlist exceptions documented in tools/covgate/
      # config.go with per-entry GRADUATE-BY notes.
      - name: coverage gate
        run: make coverage-gate

  # Epic 13 task 18 performance-SLO gate. Separate from `integration`
  # (which runs -race, inflating wall-clock 2–10×); `make slo` runs
  # without -race. No Postgres service — SLOs are etcd / in-process.
  slo:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: performance SLOs (no -race)
        run: make slo

  integration:
    runs-on: docker
    # Forgejo Actions runs each job inside a container by default, so
    # the Postgres service is reachable on the workflow's Docker network
    # at hostname `postgres`. Do NOT add `ports: [5432:5432]` — that
    # binds to the host and collides if anything else holds port 5432
    # (other runners, host-side Postgres, etc.). The hostname-based
    # connection works equally well and is portable.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kscore
          POSTGRES_PASSWORD: kscore
          POSTGRES_DB: kscore_test
        options: >-
          --health-cmd "pg_isready -U kscore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KSCORE_TEST_POSTGRES_DSN: postgres://kscore:kscore@postgres:5432/kscore_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: make test-integration

  smoke:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: make smoke

  # Epic 19 task 7 — security baseline. Four scans, one job:
  #   - gitleaks: no secrets in the full git history (fetch-depth: 0).
  #   - govulncheck: no known CVEs in deps / toolchain.
  #   - gosec: no HIGH findings (G115 globally excluded, see
  #     docs/project/SECURITY-GOVERNANCE.md for the rationale).
  #   - go-licenses: every dep Apache-2.0 / MIT / BSD-compatible
  #     (forbidden, restricted, unknown all fail).
  security:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: make install-tools
      - run: make security-secrets
      - run: make security-vulns
      - run: make security-sast
      - run: make security-licenses

  # Epic 19 task 2a (introduced) / 2c (made required).
  # Single-topology E2E: 1× kscore-server + 2× kscore-agent against
  # Postgres (Forgejo service) + embedded NATS. The 11 TestE2E_*
  # scenarios cover infrastructure health, agent registration, command
  # exec, state apply, blueprint apply, module stdlib execute, secrets
  # KV, audit log query, outbound webhook, GitOps inbound webhook, and
  # GitOps rollback FSM. Required gate for v1.0; flake recovery is
  # "revert to continue-on-error: true in a follow-up PR" if green-rate
  # drops below acceptable.
  #
  # `make e2e-test` runs in native mode (no docker required) — see the
  # Makefile and test/e2e/single/README.md. Local devs who want to
  # exercise the production Dockerfile.kscore image run
  # `make e2e-test-docker` instead.
  e2e:
    runs-on: docker
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kscore
          POSTGRES_PASSWORD: kscore
          POSTGRES_DB: kscore_test
        options: >-
          --health-cmd "pg_isready -U kscore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KSCORE_TEST_POSTGRES_DSN: postgres://kscore:kscore@postgres:5432/kscore_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: make e2e-test

  openapi:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      # The Forgejo Actions runner image (node:22-bookworm) has npm/npx
      # preinstalled. The job runs make openapi-lint, which uses
      # `npx --yes` to fetch redocly without persisting node_modules.
      - run: make openapi-lint

  docs:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      # make docs-lint runs markdownlint-cli2 via `npx --yes` (runner image
      # has npm/npx; rules + globs live in .markdownlint-cli2.yaml).
      - run: make docs-lint

  proto:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      # Install buf + protoc-gen-go + protoc-gen-go-grpc via Make rather
      # than bufbuild/buf-setup-action — the action isn't mirrored at
      # data.forgejo.org (the Forgejo runner's default action registry)
      # and `make install-tools` go-installs all three under the
      # runner's Go toolchain anyway.
      - run: make install-tools
      - run: make proto-lint
      - name: regenerate + verify clean
        run: |
          make proto
          git diff --exit-code
      - name: breaking-changes check vs previous commit
        run: make proto-breaking

  # Per-PR build smoke: linux/amd64 only. The remaining five
  # variants (linux/arm64, darwin/amd64, darwin/arm64, windows/amd64,
  # windows/arm64) live in ci-full.yml so every main push still gates
  # the full cross-build matrix; PRs only validate the host-arch build.
  build:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # actions/cache@v4 auto-detects zstd on PATH and uses parallel
      # `tar --use-compress-program zstdmt` instead of single-threaded
      # `tar -z` (gzip). Required in readers too so they can DECOMPRESS
      # the zstd-saved cache from `lint`. Idempotent: no-op if installed.
      - name: install zstd for parallel cache compression
        run: command -v zstd >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zstd)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build
