# The Generation 2 baseline gate.
#
# This is now the only gate. R06 added it and switched `main`'s required checks
# to it; R08 removed the Generation 1 workflows it was built to outlive. A
# required status context whose workflow no longer exists is never reported, and
# a branch requiring it can never be merged again — sequencing it this way round
# avoided that.
#
# It needed no Go toolchain for the markdown and DCO checks, which is why it
# survived the removal of the root module. **P11a changed that**: a root module
# exists again, so the Go gates below are part of this workflow rather than a
# separate one. A second workflow would be a second required status context to
# keep in step with branch protection, and R06's comment above records what
# happens when those drift.
#
# TESTING.md § Gate schedule is what this implements, for the work that exists.
# Gates it schedules for work that does not exist yet are listed at the end of
# this file as owed, rather than silently absent.
#
# **This workflow triggers on `push` and `workflow_dispatch`, and on no event a
# contributor can cause**, for the reason CI-RUNNER.md § "Why the workflow has no
# `pull_request` trigger" gives: the only runner this repository has is a
# self-hosted host, the repository is public, and this forge has no
# first-time-contributor gate. A `pull_request` trigger would schedule a
# contributor's code onto that host.
#
# The property is who can start a run, not how few triggers there are. Pushing a
# branch and dispatching a run both require write access; an outside contributor
# opening a pull request has neither.
#
# G25 made that true. Until then this asked for the label `docker` on
# `pull_request`, which the self-hosted runner advertised — so pull requests had
# been running there. CI-RUNNER.md carries what is and is not established about
# which runners serve that label; an unclaimed job does not report what exists.
#
# A push run reports on a pull request through the head commit's status, so
# nothing is lost but the status context's name — which is a required check, and
# therefore branch protection's business rather than this file's.
name: reboot-baseline

on:
  # Every branch, not just main: a pull request's branch is pushed to this
  # repository, so this is what verifies it before it merges.
  push:
  workflow_dispatch:

concurrency:
  group: reboot-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: keystone-docker
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so the merge base with main is reachable for the
          # DCO check's `git log A..B`. There is no merge ref to avoid any more:
          # push events check out the pushed commit itself.
          ref: ${{ github.sha }}
          fetch-depth: 0

      # markdownlint-cli2 via npx: rules and globs live in
      # .markdownlint-cli2.yaml. No Go, no project toolchain.
      - name: markdown lint
        run: make docs-lint

      # markdownlint's MD009 does not look inside fenced code blocks, which is
      # where every generated artifact in this repository lives. This gate does.
      # It needs no toolchain, so it runs before Go is set up.
      - name: whitespace
        run: make whitespace-check

      # lychee is fetched directly rather than through a Go toolchain, since
      # there is no root module to install tools from any more. The release
      # tarball holds a directory, not a bare binary, so the member path and
      # --strip-components matter; without them tar exits non-zero looking for
      # a member that does not exist. Pinned rather than :latest so a new
      # upstream release cannot change the layout under us.
      - name: install lychee
        env:
          LYCHEE_VERSION: lychee-v0.24.2
          LYCHEE_TARGET: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-${LYCHEE_TARGET}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "lychee-${LYCHEE_TARGET}/lychee"
          lychee --version

      - name: link check
        run: make docs-links

      - uses: actions/setup-go@v5
        with:
          # From the surviving module rather than a hardcoded string, so the
          # toolchain the gate uses cannot drift from the one the tool declares.
          go-version-file: tools/capcheck/go.mod
          cache: false

      # The capability catalog reads its sources from the pinned Generation 1
      # commit, so it needs full history — hence fetch-depth 0 above.
      - name: capability catalog
        run: make capability-catalog-check

      # The Generation 2 gates. setup-go above reads its version from
      # tools/capcheck/go.mod; the root module declares the same one, and a
      # mismatch is a build failure here rather than a silent divergence.
      - name: go build
        run: make build

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      # TESTING.md § Gate schedule requires unit tests and the race detector on
      # every pull request. -race is the run that matters; the plain run is
      # implied by it and is not repeated.
      - name: go test with the race detector
        run: make test-race

      # Each tool is its own module, so the root `./...` does not reach it and
      # `test-race` above never saw these. capcheck's tests had never run.
      - name: tools module tests
        run: make tools-test

      - name: dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          PATH="$(go env GOPATH)/bin:$PATH" make vuln

      # The document sweeps and the requirements register. Both are Go tools in
      # their own modules, so they need no root-module build.
      - name: document sweeps
        run: make doclint

      - name: approved document snapshots
        run: make approved-documents-check

      # C01-A's contract is intentionally pending until C01-I supplies the
      # production protocol. This proves each registered case still fails for
      # its documented reason rather than silently disappearing.
      - name: pending acceptance contract
        run: make pending-contract

      - name: protocol acceptance contract
        run: make contract

      - name: contract immutability
        run: make contract-immutability-check

      - name: requirements register
        run: make archlint

      # The exemption asserts itself: if the DCO gate is ever removed, `check`'s
      # one named exception becomes a gate nobody runs, and this fails. G25 added
      # the second half — presence was never the property, since a step can be
      # present and conditioned on an event that never fires.
      #
      # P11b moved this comment back onto its step. Inserting the two sweeps
      # above left it describing a gate three steps away.
      - name: the one CI-only gate still exists, and can still run
        run: make dco-exempt-check

      # The Docker client, pinned, in the shape lychee above already uses.
      #
      # CI-RUNNER.md § What is deployed records why this step exists: the job
      # image is node:22-bookworm and carries no docker binary, the host's
      # socket is mounted in, and no stock image carries Node and the client
      # both -- so supplying the client is the repository's job.
      #
      # DEBIAN PACKAGES RATHER THAN THE STATIC TARBALL, and the reason is
      # provenance before size. download.docker.com publishes no checksum for
      # docker-<version>.tgz at all -- .sha256, .sha256sum and .asc are each a
      # 404 -- so pinning a hash there asserts bytes someone fetched once. The
      # hashes below are the ones the repository's `Packages` index carries, and
      # that index is covered by a PGP-signed `InRelease`. The size is the
      # smaller argument: 24 MiB against 118 MB, because the tarball ships a
      # 101 MB dockerd this job never runs.
      #
      # No apt repository is registered and no keyring installed: the .deb is
      # fetched by URL and unpacked. What that costs is a Debian-family job
      # image, which is why the guard below names that cause rather than
      # letting the failure surface as `dpkg-deb: not found`.
      - name: install the pinned Docker client and compose plugin
        env:
          DOCKER_DEB: docker-ce-cli_29.8.1-1~debian.12~bookworm_amd64.deb
          DOCKER_DEB_SHA: ff812c5853c52ef120ec73132320805d179a376e42785085e2053ce7f2479860
          COMPOSE_DEB: docker-compose-plugin_5.5.1-1~debian.12~bookworm_amd64.deb
          COMPOSE_DEB_SHA: 0455e6a54bcc07b1bcb5d92d9e6e77dedc485433c87c1b75572e6d837a96e459
          DEB_BASE: https://download.docker.com/linux/debian/dists/bookworm/pool/stable/amd64
        run: |
          set -euo pipefail
          command -v dpkg-deb >/dev/null || {
            echo "::error::this step unpacks .deb packages and needs a Debian-family job image."
            echo "::error::CI-RUNNER.md records the image as node:22-bookworm; it appears to have changed."
            exit 1
          }
          tmp="$(mktemp -d)"
          for pair in "$DOCKER_DEB:$DOCKER_DEB_SHA" "$COMPOSE_DEB:$COMPOSE_DEB_SHA"; do
            deb="${pair%:*}"; want="${pair##*:}"
            curl -fsSL -o "$tmp/$deb" "$DEB_BASE/$deb"
            echo "$want  $tmp/$deb" | sha256sum -c -
            dpkg-deb -x "$tmp/$deb" "$tmp/root"
          done
          # Copied by explicit path rather than by unpacking over /, so what
          # this step puts on the host is auditable from the file.
          install -m 0755 "$tmp/root/usr/bin/docker" /usr/local/bin/docker
          install -d /usr/local/libexec/docker/cli-plugins
          install -m 0755 "$tmp/root/usr/libexec/docker/cli-plugins/docker-compose" \
            /usr/local/libexec/docker/cli-plugins/docker-compose
          rm -rf "$tmp"

      # CI-RUNNER.md § Verification, step 1: the question R6 asks. It runs here,
      # before the suite, so a client or socket problem is reported as itself
      # rather than as a test failure fifty lines further down.
      - name: R6 -- Docker works inside a job
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker info --format 'server {{.ServerVersion}}, {{.Driver}}'

      # CI-RUNNER.md § Verification, step 3: the isolation probe, in both
      # directions. The target sets KEYSTONE_REQUIRE_DOCKER, so this cannot skip
      # its way to green if the step above somehow left a broken client.
      - name: container suite
        run: make container-suite

      # The gate-set assertion lives in the Makefile so CI and a local run
      # execute the same code. An assertion written twice is two things to drift.
      - name: make check agrees with this workflow, in both directions
        run: make gates-agree

      # Every non-merge commit a branch adds must carry a Signed-off-by trailer,
      # per docs/project/DCO.md and AGENTS.md § 4.
      #
      # The base was `github.event.pull_request.base.sha` and the condition was
      # `github.event_name == 'pull_request'`. G25 removed that trigger, which
      # would have left this step's condition permanently false — the gate would
      # have stopped running and the job would still have gone green. The range
      # is therefore derived from the merge base with main instead.
      #
      # merge-base rather than `github.event.before`, which is all-zeros on a
      # branch's first push and is not an ancestor after a force-push.
      #
      # Skipped on main, whose pushes are merges of commits this already checked.
      - name: DCO sign-off on every commit this branch adds
        if: github.ref != 'refs/heads/main'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          # `set -e` without `pipefail`, deliberately. The loop below pipes into
          # `grep -q`, which exits on the first match and leaves the producer with
          # SIGPIPE; under `pipefail` that nonzero propagates and a correctly
          # signed commit is reported as missing. Demonstrated on a long message.
          set -e
          # A base this cannot resolve must fail loudly. `git log ..HEAD` with an
          # empty base is a valid empty range, so a silent failure here would
          # leave a gate that passes by checking nothing.
          git fetch --quiet origin main
          BASE_SHA="$(git merge-base FETCH_HEAD "$HEAD_SHA")"
          if [ -z "$BASE_SHA" ]; then
            echo "::error::DCO check could not resolve a merge base with main; it would check nothing"
            exit 1
          fi
          missing=()
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" \
                 | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              missing+=("$sha")
            fi
          done < <(git log --no-merges --format=%H "$BASE_SHA..$HEAD_SHA")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::DCO check failed: ${#missing[@]} commit(s) missing 'Signed-off-by:' trailer"
            echo
            echo "See docs/project/DCO.md. To fix:"
            echo "  git commit --amend --signoff       # last commit"
            echo "  git rebase --signoff <base>        # a range"
            echo
            for sha in "${missing[@]}"; do
              echo "  - $(git log -1 --format='%h %s' "$sha")"
            done
            exit 1
          fi
          total=$(git rev-list --no-merges --count "$BASE_SHA..$HEAD_SHA")
          if [ "$total" -eq 0 ]; then
            echo "DCO check: this branch adds no non-merge commit over main; nothing to check."
          else
            echo "DCO check passed: all ${total} non-merge commit(s) carry a Signed-off-by trailer."
          fi

# Gates TESTING.md schedules that this workflow does not yet run, and why.
# Listed so that an absent gate is an obligation rather than an oversight.
#
# Two entries left this list at G33, and one of them had been wrong for longer.
# "architecture-invariant and traceability lint" named P11b as its landing task
# while `make archlint` was already a step above -- an obligation listed as owed
# after it was paid, which makes the rest of the list read as less than binding.
# The Docker entry is now narrowed to the half still owed: the topology itself is
# exercised by `make container-suite`, and what C05 adds is a journey across it.
#
#   protocol compatibility and cryptographic test vectors     -> C01
#   a journey across the production Docker topology           -> C05
#   NATS permission positive and negative tests               -> C03
#   regression tests for every fixed defect                   -> each C task
#   the complete Docker journey suite, fault matrix,
#     adversarial suite, package smoke tests                  -> merge gate, C05 onward
#   nightly scale, chaos and leak checks                      -> C15
#   release-candidate VM install, upgrade and reboot          -> C13
