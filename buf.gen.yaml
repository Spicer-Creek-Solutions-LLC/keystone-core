version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: go_package
plugins:
  - remote: buf.build/protocolbuffers/go
    out: pkg/api/v1
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: pkg/api/v1
    opt:
      - paths=source_relative
inputs:
  - directory: api/proto
