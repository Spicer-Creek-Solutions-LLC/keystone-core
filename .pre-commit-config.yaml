repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: smoke-tests
        name: smoke-tests
        entry: scripts/smoke-test.sh quick
        language: script
        pass_filenames: false
        stages: [commit]
        # Only run when Go files or database-related files change
        files: \.(go|sql)$
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --fix
        language: system
        types: [go]
        pass_filenames: false
