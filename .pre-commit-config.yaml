# Pre-commit hook configuration.
# https://pre-commit.com
#
# v1.0 baseline (PROJECT-DETAILS §5.4): gofmt + golangci-lint + smoke test.
# Generic hygiene hooks (eof, trailing-ws, merge-conflict) layered on top.
#
# Install:
#   pipx install pre-commit  # or: pip3 install --user pre-commit
#   pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

      - id: smoke-tests
        name: smoke-tests
        entry: scripts/smoke-test.sh quick
        language: script
        pass_filenames: false
        stages: [pre-commit]
        # Only fire when Go or SQL surfaces change.
        files: \.(go|sql)$
