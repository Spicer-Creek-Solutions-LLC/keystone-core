          type: array
          items:
            $ref: '#/components/schemas/MirrorEndpoint'
        syncPolicy:
          $ref: '#/components/schemas/SyncPolicy'
        status:
          type: string
          enum: [active, paused, error]

    MirrorEndpoint:
      type: object
