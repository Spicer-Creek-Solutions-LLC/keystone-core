          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time

    Event:
      type: object
      required:
        - type
        - source
      properties:
        id:
          type: string
          description: Event ID (generated if not provided)
        type:
          type: string
          description: Event type
        source:
          type: string
          description: Event source
        subject:
          type: string
          description: Event subject
        time:
          type: string
          format: date-time
          description: Event timestamp
        data:
          type: object
          description: Event payload

    EventResponse:
      type: object
      properties:
        id:
          type: string
          description: Assigned event ID
        status:
          type: string
          enum: [accepted, queued]

