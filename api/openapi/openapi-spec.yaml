  # ---- secrets ----------------------------------------------------------
  /api/v1/secrets/{path}:
    parameters:
      - in: path
        name: path
        required: true
        schema: { type: string }
        description: |
          Hierarchical secret path like `production/db/postgres`.
          The Go ServeMux pattern uses `{path...}` (multi-segment
          wildcard); this OpenAPI form treats it as one parameter for
          documentation purposes.
    get:
      tags: [secrets]
      summary: Read a secret (cleartext for authorized callers)
      responses:
        "200":
          description: Secret cleartext + metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata: { $ref: "#/components/schemas/SecretMetadata" }
                  data:
                    type: object
                    additionalProperties: { type: string }
        "501": { $ref: "#/components/responses/NotImplemented" }
    put:
      tags: [secrets]
      summary: Write a secret
      responses:
        "201":
          description: Stored.
          content:
