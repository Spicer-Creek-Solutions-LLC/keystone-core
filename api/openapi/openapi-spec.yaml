          type: string
        region:
          type: string
        bucket:
          type: string

    SyncPolicy:
      type: object
      properties:
        schedule:
          type: string
          description: Cron expression
        conflictResolution:
          type: string
          enum: [source-wins, dest-wins, manual, newest]
        deletePolicy:
          type: string
          enum: [sync, preserve]

    MirrorGroupList:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/MirrorGroup'
