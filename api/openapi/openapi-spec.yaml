    CreateAPIKeyResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
          description: API key value (only returned once at creation)
        role:
          type: string
        expires_at:
          type: string
          format: date-time

    APIKeyEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
