              status:
                type: string
                enum: [idle, syncing, error]
              progress:
                type: number
                format: float
              filesProcessed:
                type: integer
              bytesTransferred:
                type: integer
                format: int64

    SyncOperationList:
      type: object
      properties:
        operations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              groupId:
                type: string
              status:
                type: string
              startedAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time

    SyncHistoryList:
      type: object
      properties:
        history:
          type: array
          items:
            type: object
            properties:
