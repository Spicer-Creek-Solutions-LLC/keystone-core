// ControlPlaneService — operator-facing RPCs (kscorectl, dashboards,
// scripts).

syntax = "proto3";

package keystone.core.v1;

import "google/protobuf/timestamp.proto";
import "keystone/core/v1/common.proto";

option go_package = "go.keystone-core.io/keystone-core/pkg/api/v1;v1";

service ControlPlaneService {
  rpc ServerStatus(ServerStatusRequest) returns (ServerStatusResponse);

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);

  // QuarantineAgent isolates an agent: transitions it to DISABLED so
  // its heartbeats are rejected and no commands dispatch to it (incident
  // response). UnquarantineAgent reverses it back to CONNECTED (the
  // monitor re-stales it if the agent is actually gone).
  rpc QuarantineAgent(QuarantineAgentRequest) returns (QuarantineAgentResponse);
  rpc UnquarantineAgent(UnquarantineAgentRequest) returns (UnquarantineAgentResponse);

  // ExecuteCommand dispatches a single command to one agent and
  // streams CommandOutputChunk(s) followed by a CommandCompletion.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (stream ExecuteCommandResponse);

  // BatchExecuteCommand dispatches one command to multiple agents
  // selected by Target. Stream emits per-agent lifecycle events
  // interleaved with output chunks; closes with BatchTerminal.
  // See PROJECT-DETAILS §4.5 streaming patterns.
  rpc BatchExecuteCommand(BatchExecuteCommandRequest) returns (stream BatchExecuteCommandResponse);

  rpc GetCommandStatus(GetCommandStatusRequest) returns (GetCommandStatusResponse);
  rpc ListCommandHistory(ListCommandHistoryRequest) returns (ListCommandHistoryResponse);

  // GetBatchJob returns the current persisted state of a batch.
  rpc GetBatchJob(GetBatchJobRequest) returns (GetBatchJobResponse);

  // ListBatchJobs paginates batches with optional status / time-window
  // filters. v1.0 uses offset/limit; cursor-based paging is v1.x.
  rpc ListBatchJobs(ListBatchJobsRequest) returns (ListBatchJobsResponse);

  // CancelBatchJob signals an in-flight batch to stop; in-flight
  // per-agent goroutines drain naturally.
  rpc CancelBatchJob(CancelBatchJobRequest) returns (CancelBatchJobResponse);

  // ListBatchAgentResults returns every per-agent result for a batch.
  rpc ListBatchAgentResults(ListBatchAgentResultsRequest) returns (ListBatchAgentResultsResponse);

  // GetBatchAgentResult fetches a single (batch, agent) result row.
  rpc GetBatchAgentResult(GetBatchAgentResultRequest) returns (GetBatchAgentResultResponse);
}

// ---- ServerStatus ---------------------------------------------------------

message ServerStatusRequest {}

message ServerStatusResponse {
  string version = 1;
  string commit = 2;
  google.protobuf.Timestamp build_date = 3;
  google.protobuf.Timestamp started_at = 4;
  int32 connected_agents = 5;
  bool nats_healthy = 6;
  bool storage_healthy = 7;
  string mode = 8; // "development" | "production"
}

// ---- ListAgents -----------------------------------------------------------

message ListAgentsRequest {
  AgentStatus status = 1; // UNSPECIFIED = no filter
  string label_key = 2;
  string label_value = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ---- GetAgent -------------------------------------------------------------

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

// ---- Quarantine -----------------------------------------------------------

message QuarantineAgentRequest {
  string agent_id = 1;
  string reason = 2; // optional operator note for the audit trail
}

message QuarantineAgentResponse {
  string agent_id = 1;
  AgentStatus status = 2;
}

message UnquarantineAgentRequest {
  string agent_id = 1;
}

message UnquarantineAgentResponse {
  string agent_id = 1;
  AgentStatus status = 2;
}

// ---- ExecuteCommand -------------------------------------------------------

message ExecuteCommandRequest {
  string agent_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string working_dir = 5;
  string user = 6;
  int32 timeout_seconds = 7;
}

message ExecuteCommandResponse {
  oneof event {
    string command_id = 1; // emitted first; identifies the dispatched command
    CommandOutputChunk output = 2;
    CommandCompletion completion = 3;
  }
}

// ---- BatchExecuteCommand --------------------------------------------------

message BatchExecuteCommandRequest {
  Target target = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string working_dir = 5;
  string user = 6;
  int32 timeout_seconds = 7;
  int32 concurrency = 8;
  bool continue_on_failure = 9;
  // dry_run resolves the Target and emits a single BatchPreview event
  // followed by a Completed BatchTerminal without persisting a batch
  // row or dispatching commands.
  bool dry_run = 10;
}

message BatchExecuteCommandResponse {
  oneof event {
    string batch_job_id = 1;
    BatchAgentLifecycle lifecycle = 2;
    BatchAgentOutput output = 3;
    BatchTerminal terminal = 4;
    // preview is emitted only on dry_run dispatches and carries the
    // resolved agent set without any execution lifecycle.
    BatchPreview preview = 5;
  }
}

// BatchAgentOutput is one agent's output chunk within a batch stream.
message BatchAgentOutput {
  string agent_id = 1;
  CommandOutputChunk output = 2;
}

// BatchPreview lists agent IDs that would be dispatched, emitted by
// dry_run BatchExecuteCommand requests.
message BatchPreview {
  repeated string agent_ids = 1;
}

// ---- Batch job lifecycle (task 11b) ---------------------------------------

message GetBatchJobRequest {
  string batch_job_id = 1;
}

message GetBatchJobResponse {
  BatchJob batch = 1;
}

message ListBatchJobsRequest {
  BatchJobStatus status = 1; // UNSPECIFIED = no filter
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  int32 limit = 4;  // 0 = server default; capped server-side
  int32 offset = 5;
}

message ListBatchJobsResponse {
  repeated BatchJob batches = 1;
}

message CancelBatchJobRequest {
  string batch_job_id = 1;
}

message CancelBatchJobResponse {}

message ListBatchAgentResultsRequest {
  string batch_job_id = 1;
}

message ListBatchAgentResultsResponse {
  repeated BatchAgentResult results = 1;
}

message GetBatchAgentResultRequest {
  string batch_job_id = 1;
  string agent_id = 2;
}

message GetBatchAgentResultResponse {
  BatchAgentResult result = 1;
}

// ---- GetCommandStatus -----------------------------------------------------

message GetCommandStatusRequest {
  string command_id = 1;
}

message GetCommandStatusResponse {
  Command command = 1;
}

// ---- ListCommandHistory ---------------------------------------------------

message ListCommandHistoryRequest {
  string agent_id = 1; // empty = all agents
  CommandStatus status = 2;
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListCommandHistoryResponse {
  repeated Command commands = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}
