// SecretsService — KV + lease + transit RPCs. v1.0 backends are
// encrypted-file and HashiCorp Vault. Refined in epic 10 (Secrets).

syntax = "proto3";

package keystone.core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "go.keystone-core.io/keystone-core/pkg/api/v1;v1";

service SecretsService {
  // ---- KV ops ---
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc WriteSecret(WriteSecretRequest) returns (WriteSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // ---- Lease ops ---
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc RevokeLease(RevokeLeaseRequest) returns (RevokeLeaseResponse);

  // ---- Transit (cryptographic ops on a managed key) ---
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

// ---- KV -------------------------------------------------------------------

// SecretMetadata is the non-sensitive shape of a stored secret.
// Cleartext values are returned only on Get/Write; metadata-only
// listings expose just this.
message SecretMetadata {
  string path = 1;
  string version = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  map<string, string> labels = 6;
}

message GetSecretRequest {
  string path = 1;
  string version = 2; // empty = latest
}

message GetSecretResponse {
  SecretMetadata metadata = 1;
  // Cleartext key/value pairs. Returned only to callers with read
  // capability for the secret path.
  map<string, string> data = 2;
}

message ListSecretsRequest {
  string path_prefix = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message WriteSecretRequest {
  string path = 1;
  map<string, string> data = 2;
  map<string, string> labels = 3;
  // Optional TTL; 0 = no expiry.
  int32 ttl_seconds = 4;
}

message WriteSecretResponse {
  SecretMetadata metadata = 1;
}

message DeleteSecretRequest {
  string path = 1;
  // Empty version deletes all versions; specific version deletes only
  // that version.
  string version = 2;
}

message DeleteSecretResponse {}

// ---- Leases ---------------------------------------------------------------

message Lease {
  string id = 1;
  string secret_path = 2;
  string holder = 3; // principal id
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool renewable = 6;
}

message GetLeaseRequest {
  string lease_id = 1;
}

message GetLeaseResponse {
  Lease lease = 1;
}

message ListLeasesRequest {
  string secret_path = 1;
  string holder = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListLeasesResponse {
  repeated Lease leases = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message RenewLeaseRequest {
  string lease_id = 1;
  int32 increment_seconds = 2;
}

message RenewLeaseResponse {
  Lease lease = 1;
}

message RevokeLeaseRequest {
  string lease_id = 1;
}

message RevokeLeaseResponse {}

// ---- Transit --------------------------------------------------------------

message EncryptRequest {
  string key_name = 1;
  bytes plaintext = 2;
  // Optional context for AEAD-style key-bound encryption.
  bytes context = 3;
}

message EncryptResponse {
  bytes ciphertext = 1;
  string key_version = 2;
}

message DecryptRequest {
  string key_name = 1;
  bytes ciphertext = 2;
  bytes context = 3;
}

message DecryptResponse {
  bytes plaintext = 1;
}

message SignRequest {
  string key_name = 1;
  bytes message = 2;
  string algorithm = 3; // e.g., "ed25519", "rsa-pss-sha256"
}

message SignResponse {
  bytes signature = 1;
  string key_version = 2;
}

message VerifyRequest {
  string key_name = 1;
  bytes message = 2;
  bytes signature = 3;
  string algorithm = 4;
}

message VerifyResponse {
  bool valid = 1;
}
