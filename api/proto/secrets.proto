syntax = "proto3";

package keystone.core.v1;

option go_package = "github.com/shawnbutts/keystone-core/pkg/api/v1;v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// SecretsService provides secret management operations including
// CRUD, lease management, and transit encryption.
service SecretsService {
  // GetSecret retrieves a secret by path
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);

  // ListSecrets lists secret keys under a path prefix
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // WriteSecret writes a secret to a backend
  rpc WriteSecret(WriteSecretRequest) returns (WriteSecretResponse);

  // DeleteSecret deletes a secret from a backend
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // GetLease retrieves a lease by ID
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);

  // ListLeases lists tracked leases with optional filtering
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);

  // RenewLease renews a lease
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // RevokeLease revokes a lease
  rpc RevokeLease(RevokeLeaseRequest) returns (RevokeLeaseResponse);

  // Encrypt encrypts plaintext using a transit key
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);

  // Decrypt decrypts ciphertext using a transit key
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);

  // Sign signs input data using a transit key
  rpc Sign(SignRequest) returns (SignResponse);

  // Verify verifies a signature against input data
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

// SecretData represents secret data with metadata
message SecretData {
  // Secret path
  string path = 1;

  // Backend that served this secret
  string backend = 2;

  // Secret type (static, dynamic, pki, transit, etc.)
  string type = 3;

  // Secret data as key-value pairs
  google.protobuf.Struct data = 4;

  // Additional metadata
  map<string, string> metadata = 5;

  // Secret version (if versioned)
  int32 version = 6;

  // Creation timestamp
  google.protobuf.Timestamp created_at = 7;

  // Expiration timestamp (zero = no expiry)
  google.protobuf.Timestamp expires_at = 8;

  // Whether the secret is renewable
  bool renewable = 9;

  // Lease ID (if dynamic secret)
  string lease_id = 10;
}

// LeaseInfo represents a secret lease
message LeaseInfo {
  // Unique lease identifier
  string id = 1;

  // Path of the associated secret
  string secret_path = 2;

  // Backend that issued this lease
  string backend = 3;

  // Current lease state (pending, active, renewing, expired, revoked)
  string state = 4;

  // Time-to-live in seconds
  int64 ttl_seconds = 5;

  // Maximum TTL in seconds (even with renewals)
  int64 max_ttl_seconds = 6;

  // When the lease was issued
  google.protobuf.Timestamp issued_at = 7;

  // When the lease expires
  google.protobuf.Timestamp expires_at = 8;

  // When the lease was last renewed
  google.protobuf.Timestamp last_renewal = 9;

  // How many times the lease has been renewed
  int32 renewal_count = 10;

  // Whether the lease can be renewed
  bool renewable = 11;

  // Whether the lease can be explicitly revoked
  bool revocable = 12;

  // Additional lease metadata
  map<string, string> metadata = 13;
}

// GetSecretRequest requests a secret by path
message GetSecretRequest {
  // Secret path (e.g., "vault/kv/myapp/config")
  string path = 1;

  // Specific version to retrieve (0 = latest)
  int32 version = 2;
}

// GetSecretResponse returns the requested secret
message GetSecretResponse {
  // The secret data
  SecretData secret = 1;
}

// ListSecretsRequest lists secrets under a path prefix
message ListSecretsRequest {
  // Backend name to list from
  string backend = 1;

  // Path prefix to list under
  string prefix = 2;

  // Maximum number of results
  int32 page_size = 3;

  // Pagination token
  string page_token = 4;
}

// ListSecretsResponse returns the list of secret keys
message ListSecretsResponse {
  // Secret key paths
  repeated string keys = 1;

  // Next page token (empty if no more results)
  string next_page_token = 2;
}

// WriteSecretRequest writes a secret
message WriteSecretRequest {
  // Secret path
  string path = 1;

  // Secret data as key-value pairs
  google.protobuf.Struct data = 2;

  // Additional metadata
  map<string, string> metadata = 3;
}

// WriteSecretResponse confirms a secret was written
message WriteSecretResponse {
  // The path the secret was written to
  string path = 1;

  // Whether the write was successful
  bool written = 2;
}

// DeleteSecretRequest deletes a secret
message DeleteSecretRequest {
  // Secret path to delete
  string path = 1;
}

// DeleteSecretResponse confirms a secret was deleted
message DeleteSecretResponse {
  // The path that was deleted
  string path = 1;

  // Whether the delete was successful
  bool deleted = 2;
}

// GetLeaseRequest retrieves a lease by ID
message GetLeaseRequest {
  // Lease ID
  string lease_id = 1;
}

// GetLeaseResponse returns the requested lease
message GetLeaseResponse {
  // The lease information
  LeaseInfo lease = 1;
}

// ListLeasesRequest lists tracked leases
message ListLeasesRequest {
  // Filter by secret path prefix (optional)
  string path_prefix = 1;

  // Filter by backend type (optional)
  string backend = 2;

  // Maximum number of results
  int32 page_size = 3;

  // Pagination token
  string page_token = 4;
}

// ListLeasesResponse returns the list of leases
message ListLeasesResponse {
  // Tracked leases
  repeated LeaseInfo leases = 1;

  // Next page token (empty if no more results)
  string next_page_token = 2;

  // Total count of matching leases
  int32 total_count = 3;
}

// RenewLeaseRequest renews a lease
message RenewLeaseRequest {
  // Lease ID to renew
  string lease_id = 1;

  // Requested TTL increment in seconds (0 = use original TTL)
  int64 increment_seconds = 2;
}

// RenewLeaseResponse returns the renewed lease
message RenewLeaseResponse {
  // The renewed lease
  LeaseInfo lease = 1;
}

// RevokeLeaseRequest revokes a lease
message RevokeLeaseRequest {
  // Lease ID to revoke
  string lease_id = 1;
}

// RevokeLeaseResponse confirms a lease was revoked
message RevokeLeaseResponse {
  // The revoked lease ID
  string lease_id = 1;

  // Whether the revocation was successful
  bool revoked = 2;
}

// EncryptRequest encrypts plaintext using a transit key
message EncryptRequest {
  // Transit key name
  string key_name = 1;

  // Plaintext data to encrypt
  bytes plaintext = 2;

  // Additional authenticated data (AAD)
  bytes context = 3;

  // Key version to use (0 = latest)
  int32 key_version = 4;
}

// EncryptResponse returns the encrypted ciphertext
message EncryptResponse {
  // Encrypted ciphertext
  string ciphertext = 1;

  // Key version used for encryption
  int32 key_version = 2;
}

// DecryptRequest decrypts ciphertext using a transit key
message DecryptRequest {
  // Transit key name
  string key_name = 1;

  // Ciphertext to decrypt
  string ciphertext = 2;

  // Additional authenticated data (AAD)
  bytes context = 3;
}

// DecryptResponse returns the decrypted plaintext
message DecryptResponse {
  // Decrypted plaintext
  bytes plaintext = 1;

  // Key version used for decryption
  int32 key_version = 2;
}

// SignRequest signs input data using a transit key
message SignRequest {
  // Transit key name
  string key_name = 1;

  // Input data to sign
  bytes input = 2;

  // Hash algorithm (optional)
  string algorithm = 3;

  // Key version to use (0 = latest)
  int32 key_version = 4;
}

// SignResponse returns the signature
message SignResponse {
  // Generated signature
  string signature = 1;

  // Key version used for signing
  int32 key_version = 2;
}

// VerifyRequest verifies a signature against input data
message VerifyRequest {
  // Transit key name
  string key_name = 1;

  // Input data that was signed
  bytes input = 2;

  // Signature to verify
  string signature = 3;

  // Hash algorithm (optional)
  string algorithm = 4;
}

// VerifyResponse returns whether the signature is valid
message VerifyResponse {
  // Whether the signature is valid
  bool valid = 1;
}
