# Keystone Core GoReleaser Configuration
# Documentation: https://goreleaser.com

version: 2

project_name: keystone-core

before:
  hooks:
    - go mod tidy
    - go generate ./...

# Build configuration for all binaries
builds:
  # Control Plane Server
  - id: kscore-server
    binary: kscore-server
    main: ./cmd/kscore-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/shawnbutts/keystone-core/pkg/version.Version={{.Version}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.BuildDate={{.Date}}

  # Agent Daemon
  - id: kscore-agent
    binary: kscore-agent
    main: ./cmd/kscore-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/shawnbutts/keystone-core/pkg/version.Version={{.Version}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.BuildDate={{.Date}}

  # Main CLI
  - id: kscorectl
    binary: kscorectl
    main: ./cmd/kscorectl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/shawnbutts/keystone-core/pkg/version.Version={{.Version}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.BuildDate={{.Date}}

  # Remote Execution Plugin
  - id: kscore-exec
    binary: kscore-exec
    main: ./cmd/kscore-exec
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/shawnbutts/keystone-core/pkg/version.Version={{.Version}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.BuildDate={{.Date}}

  # State Management Plugin
  - id: kscore-state
    binary: kscore-state
    main: ./cmd/kscore-state
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/shawnbutts/keystone-core/pkg/version.Version={{.Version}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.BuildDate={{.Date}}

  # TUI Monitor
  - id: kscore-monitor
    binary: kscore-monitor
    main: ./cmd/kscore-monitor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/shawnbutts/keystone-core/pkg/version.Version={{.Version}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.BuildDate={{.Date}}

# Archive configuration
archives:
  - id: unix
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md
      - deploy/systemd/*
  - id: windows
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md

# Linux packages (RPM and DEB)
nfpms:
  # Server package
  - id: kscore-server
    package_name: kscore-server
    ids:
      - kscore-server
    vendor: Keystone Core
    homepage: https://github.com/shawnbutts/keystone-core
    maintainer: Keystone Core Team <team@keystonecore.io>
    description: |
      Keystone Core Control Plane Server
      A cloud-native runtime infrastructure control plane that bridges
      the gap between GitOps deployments and operational reality.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      # Systemd service file
      - src: deploy/systemd/kscore-server.service
        dst: /usr/lib/systemd/system/kscore-server.service
        type: config
      # Default configuration
      - src: deploy/config/server.yaml
        dst: /etc/keystone-core/server.yaml
        type: config|noreplace
      # Data directory
      - dst: /var/lib/keystone-core
        type: dir
        file_info:
          mode: 0750
      # Log directory
      - dst: /var/log/keystone-core
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: deploy/scripts/postinstall-server.sh
      preremove: deploy/scripts/preremove-server.sh
    overrides:
      rpm:
        dependencies:
          - systemd
      deb:
        dependencies:
          - systemd

  # Agent package
  - id: kscore-agent
    package_name: kscore-agent
    ids:
      - kscore-agent
    vendor: Keystone Core
    homepage: https://github.com/shawnbutts/keystone-core
    maintainer: Keystone Core Team <team@keystonecore.io>
    description: |
      Keystone Core Agent
      Lightweight agent for managed nodes that executes commands,
      applies state configurations, and reports status to the control plane.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      # Systemd service file
      - src: deploy/systemd/kscore-agent.service
        dst: /usr/lib/systemd/system/kscore-agent.service
        type: config
      # Default configuration
      - src: deploy/config/agent.yaml
        dst: /etc/keystone-core/agent.yaml
        type: config|noreplace
      # Cache directory
      - dst: /var/cache/keystone-core
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: deploy/scripts/postinstall-agent.sh
      preremove: deploy/scripts/preremove-agent.sh
    overrides:
      rpm:
        dependencies:
          - systemd
      deb:
        dependencies:
          - systemd

  # CLI tools package
  - id: kscore-cli
    package_name: kscore-cli
    ids:
      - kscorectl
      - kscore-exec
      - kscore-state
      - kscore-monitor
    vendor: Keystone Core
    homepage: https://github.com/shawnbutts/keystone-core
    maintainer: Keystone Core Team <team@keystonecore.io>
    description: |
      Keystone Core CLI Tools
      Command-line tools for interacting with Keystone Core including
      kscorectl (main CLI), kscore-exec (remote execution), kscore-state
      (state management), and kscore-monitor (TUI dashboard).
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      # Shell completions
      - src: deploy/completions/kscorectl.bash
        dst: /usr/share/bash-completion/completions/kscorectl
        type: config
      - src: deploy/completions/kscorectl.zsh
        dst: /usr/share/zsh/site-functions/_kscorectl
        type: config

# Checksum configuration
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Snapshot configuration for development builds
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Security
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

# Release configuration
release:
  github:
    owner: kscore
    name: keystone-core
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Keystone Core {{ .Version }}

    Welcome to Keystone Core {{ .Version }}! This release includes the following changes:
  footer: |
    ## Installation

    ### Binary Installation
    Download the appropriate archive for your platform from the assets below.

    ### Package Installation (Linux)
    ```bash
    # Debian/Ubuntu
    sudo dpkg -i kscore-server_{{ .Version }}_linux_amd64.deb
    sudo dpkg -i kscore-agent_{{ .Version }}_linux_amd64.deb
    sudo dpkg -i kscore-cli_{{ .Version }}_linux_amd64.deb

    # RHEL/CentOS/Fedora
    sudo rpm -i kscore-server-{{ .Version }}.x86_64.rpm
    sudo rpm -i kscore-agent-{{ .Version }}.x86_64.rpm
    sudo rpm -i kscore-cli-{{ .Version }}.x86_64.rpm
    ```

    ### Docker
    ```bash
    docker pull ghcr.io/kscore/kscore-server:{{ .Version }}
    docker pull ghcr.io/kscore/kscore-agent:{{ .Version }}
    ```

    ## Documentation
    Full documentation is available at https://docs.keystonecore.io

    ## Checksums
    SHA256 checksums are available in `checksums.txt`

