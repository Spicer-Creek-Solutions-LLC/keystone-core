# GoReleaser configuration — v0.1.0 release baseline.
# https://goreleaser.com
#
# Scope (epic 19 task 12):
#   - 20 binaries (every cmd/kscore-*).
#   - 5 archives: linux/darwin × amd64/arm64 + windows amd64.
#     (windows arm64 dropped — uncommon in the operator audience.)
#   - 3 nfpm package families (server, agent, cli) × deb + rpm × amd64 + arm64.
#   - checksums.txt covering everything.
#
# Deferred to later epic-19 tasks:
#   - Docker images                     -> task 13 (Dockerfile.release).
#   - GPG / cosign signing              -> task 14 (v0.1.0-rc1 ceremony).
#   - Publishing to forge / homebrew    -> task 14+ (manual per playbook).
#   - SBOM generation                   -> separate make security-sbom path
#                                          (CycloneDX + SPDX); not bundled
#                                          into goreleaser.
#
# See RELEASE-PLAYBOOK.md §Phase 4 "Build" for the operator
# procedure that drives this file. See `make release-snapshot`
# (no tag required) and `make release` (skip-publish, signs +
# uploads manually) for the entrypoints.

version: 2

project_name: keystone-core

before:
  hooks:
    - go mod tidy

# Shared build settings. -s/-w strip debug + symbol tables; -X entries
# inject build metadata into pkg/version (same path as the Makefile).
# -trimpath is required by RELEASE-PLAYBOOK.md §Build Environment.
# Anchors live on the first build because goreleaser rejects unknown
# top-level keys.
builds:
  - id: kscore-server
    binary: kscore-server
    main: ./cmd/kscore-server
    env: &env [CGO_ENABLED=0]
    flags: &flags [-trimpath]
    goos: &goos [linux, darwin, windows]
    goarch: &goarch [amd64, arm64]
    ignore: &ignore
      # windows arm64 isn't in the operator audience for v0.x — drop
      # it from every build (overrides the goarch list above).
      - goos: windows
        goarch: arm64
    ldflags: &ldflags
      - -s -w
      - -X go.keystone-core.io/keystone-core/pkg/version.Version={{.Version}}
      - -X go.keystone-core.io/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X go.keystone-core.io/keystone-core/pkg/version.BuildDate={{.Date}}

  - id: kscore-agent
    binary: kscore-agent
    main: ./cmd/kscore-agent
    env: *env
    flags: *flags
    goos: *goos
    goarch: *goarch
    ignore: *ignore
    ldflags: *ldflags

  - id: kscorectl
    binary: kscorectl
    main: ./cmd/kscorectl
    env: *env
    flags: *flags
    goos: *goos
    goarch: *goarch
