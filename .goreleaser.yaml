# One archive per (goos, goarch) bundling ALL 20 binaries plus the
# project-level legal/text files. Archive name matches the
# convention in RELEASE-PLAYBOOK.md §Phase 7 Package Construction.
archives:
  - id: default
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

# Linux native packages. Three families per RELEASE-PLAYBOOK.md
# Phase 7 file inventory:
#   - kscore-server: server binary + systemd unit.
#   - kscore-agent:  agent binary + systemd unit.
#   - kscore-cli:    kscorectl + every kscore-* sub-binary it
#                    dispatches to (the README plugin pattern).
nfpms:
  - id: kscore-server
    package_name: kscore-server
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: "Spicer Creek Solutions LLC"
    homepage: "https://codeberg.org/Spicer-Creek-Solutions-LLC/keystone-core"
    maintainer: "Keystone Core <keystone-core@shawnbutts.com>"
    description: |
      Keystone Core control-plane server — gRPC + REST + GitOps
      webhook listeners; coordinates the agent fleet via NATS and
      durable state via Postgres or SQLite.
    license: "Apache-2.0"
    formats: [deb, rpm]
    ids: [kscore-server]
    bindir: /usr/bin
    scripts:
      postinstall: "./deploy/packaging/kscore-server.postinst"
      preremove:   "./deploy/packaging/kscore-server.preremove"
      postremove:  "./deploy/packaging/kscore-server.postremove"
    contents:
      - src: ./deploy/systemd/kscore-server.service
        dst: /lib/systemd/system/kscore-server.service
      - src: ./deploy/config/server.yaml.template
        dst: /usr/share/kscore/server.yaml.template
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/kscore-server/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/kscore-server/README.md
        file_info:
          mode: 0644

  - id: kscore-agent
    package_name: kscore-agent
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: "Spicer Creek Solutions LLC"
    homepage: "https://codeberg.org/Spicer-Creek-Solutions-LLC/keystone-core"
    maintainer: "Keystone Core <keystone-core@shawnbutts.com>"
    description: |
      Keystone Core managed-host agent — runs on every managed
      host; receives commands + applies state from the control
      plane over NATS.
    license: "Apache-2.0"
    formats: [deb, rpm]
    ids: [kscore-agent]
    bindir: /usr/bin
    scripts:
      postinstall: "./deploy/packaging/kscore-agent.postinst"
      preremove:   "./deploy/packaging/kscore-agent.preremove"
      postremove:  "./deploy/packaging/kscore-agent.postremove"
    contents:
      - src: ./deploy/systemd/kscore-agent.service
        dst: /lib/systemd/system/kscore-agent.service
      - src: ./deploy/config/agent.yaml.template
        dst: /usr/share/kscore/agent.yaml.template
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/kscore-agent/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/kscore-agent/README.md
        file_info:
          mode: 0644

  - id: kscore-cli
    package_name: kscore-cli
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: "Spicer Creek Solutions LLC"
    homepage: "https://codeberg.org/Spicer-Creek-Solutions-LLC/keystone-core"
    maintainer: "Keystone Core <keystone-core@shawnbutts.com>"
    description: |
      Keystone Core operator CLI — kscorectl + the dispatched
      kscore-* sub-binaries (audit, backup, blueprint, bootstrap,
      cluster, cluster-backup, events, files, gitops, identity,
      migrate, module, policy, registry, runbook, secrets,
      webhook).
    license: "Apache-2.0"
    formats: [deb, rpm]
    # All operator CLIs that kscorectl dispatches to live in this
    # package so a single `apt install kscore-cli` puts every
    # subcommand on PATH.
    ids:
      - kscorectl
      - kscore-audit
      - kscore-backup
      - kscore-blueprint
      - kscore-bootstrap
      - kscore-cluster
      - kscore-cluster-backup
      - kscore-events
      - kscore-files
      - kscore-gitops
      - kscore-identity
      - kscore-migrate
      - kscore-module
      - kscore-policy
      - kscore-registry
      - kscore-runbook
      - kscore-secrets
      - kscore-webhook
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/kscore-cli/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/kscore-cli/README.md
        file_info:
          mode: 0644

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# Releases are NOT published automatically. The signing + upload
# flow lives in RELEASE-PLAYBOOK.md (phases 6–9) and runs by hand
# on the offline workstation. `make release` calls goreleaser with
# --skip=publish so the artifacts land in dist/ but never reach a
# forge.
release:
  disable: true

changelog:
  disable: true
