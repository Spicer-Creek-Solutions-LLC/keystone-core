# GoReleaser configuration — v1.0 baseline (snapshot only).
# https://goreleaser.com
#
# Scope: builds the three v1.0 hello-world binaries (kscore-server,
# kscore-agent, kscorectl) for the v1.0 platform matrix and packages
# them into per-platform tar.gz / zip archives with a checksums file.
#
# Out of scope until later epics:
#   - nfpm (deb/rpm) packaging          -> epic 19 release-hardening
#   - Docker images                     -> epic 19
#   - Code signing / SBOM               -> v1.2 signing ceremony
#                                          (RELEASE-PLAYBOOK.md)
#   - Publishing to forge / homebrew    -> v1.0 is snapshot-only;
#                                          v1.2 brings the offline
#                                          multi-party ceremony.

version: 2

project_name: keystone-core

before:
  hooks:
    - go mod tidy

# Shared build settings. -s/-w strip debug + symbol tables; -X entries
# inject build metadata into pkg/version (same path as the Makefile).
# -trimpath in flags: required by RELEASE-PLAYBOOK.md §Build Environment.
# Anchors live on the first build because goreleaser rejects unknown
# top-level keys.
builds:
  - id: kscore-server
    binary: kscore-server
    main: ./cmd/kscore-server
    env: &env [CGO_ENABLED=0]
    flags: &flags [-trimpath]
    goos: &goos [linux, darwin, windows]
    goarch: &goarch [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X go.keystone-core.io/keystone-core/pkg/version.Version={{.Version}}
      - -X go.keystone-core.io/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X go.keystone-core.io/keystone-core/pkg/version.BuildDate={{.Date}}

  - id: kscore-agent
    binary: kscore-agent
    main: ./cmd/kscore-agent
    env: *env
    flags: *flags
    goos: *goos
    goarch: *goarch
    ldflags: *ldflags

  - id: kscorectl
    binary: kscorectl
    main: ./cmd/kscorectl
    env: *env
    flags: *flags
    goos: *goos
    goarch: *goarch
    ldflags: *ldflags

# One archive per (goos, goarch) bundling all three binaries plus the
# project-level legal/text files. Archive name matches the convention
# in RELEASE-PLAYBOOK.md §Build Steps.
archives:
  - id: default
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# v1.0 ships snapshot tarballs only. The signing ceremony + multi-party
# publish process lands in v1.2 per RELEASE-PLAYBOOK.md. Disable so an
# accidental `goreleaser release` (without --snapshot) doesn't try to
# push anywhere.
release:
  disable: true

changelog:
  disable: true
