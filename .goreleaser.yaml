# Archive configuration
archives:
  - id: unix
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: README.md
        dst: README.md
      - src: LICENSE
        dst: LICENSE
      - src: CHANGELOG.md
        dst: CHANGELOG.md
      - src: deploy/systemd/*
        dst: systemd/
  - id: windows
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: README.md
        dst: README.md
      - src: LICENSE
        dst: LICENSE
      - src: CHANGELOG.md
        dst: CHANGELOG.md

# Linux packages (RPM and DEB)
nfpms:
  # Server package
  - id: kscore-server
    package_name: kscore-server
    ids:
      - kscore-server
    vendor: Keystone Core
    homepage: https://github.com/shawnbutts/keystone-core
    maintainer: Spicer Creek Solutions LLC <team@keystonecore.io>
    description: |
      Keystone Core Control Plane Server
      A cloud-native runtime infrastructure control plane that bridges
      the gap between GitOps deployments and operational reality.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      - src: deploy/systemd/kscore-server.service
        dst: /usr/lib/systemd/system/kscore-server.service
        type: config
      - src: deploy/config/server.yaml
        dst: /etc/keystone-core/server.yaml
        type: config|noreplace
      - dst: /var/lib/keystone-core
        type: dir
        file_info:
          mode: 0750
      - dst: /var/log/keystone-core
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: deploy/scripts/postinstall-server.sh
      preremove: deploy/scripts/preremove-server.sh
    overrides:
      rpm:
        dependencies: [systemd]
      deb:
        dependencies: [systemd]

  # Agent package
  - id: kscore-agent
    package_name: kscore-agent
    ids:
      - kscore-agent
    vendor: Keystone Core
    homepage: https://github.com/shawnbutts/keystone-core
    maintainer: Spicer Creek Solutions LLC <team@keystonecore.io>
    description: |
      Keystone Core Agent
      Lightweight agent for managed nodes that executes commands,
      applies state configurations, and reports status to the control plane.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      - src: deploy/systemd/kscore-agent.service
        dst: /usr/lib/systemd/system/kscore-agent.service
        type: config
      - src: deploy/config/agent.yaml
        dst: /etc/keystone-core/agent.yaml
        type: config|noreplace
      - dst: /var/cache/keystone-core
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: deploy/scripts/postinstall-agent.sh
      preremove: deploy/scripts/preremove-agent.sh
    overrides:
      rpm:
        dependencies: [systemd]
      deb:
        dependencies: [systemd]

  # CLI tools package (includes all CLI plugins)
  - id: kscore-cli
    package_name: kscore-cli
    ids:
      - kscorectl
      - kscore-exec
      - kscore-state
      - kscore-monitor
      - kscore-agents
      - kscore-module
      - kscore-policy
      - kscore-audit
      - kscore-gitops
      - kscore-webhook
      - kscore-cluster
      - kscore-cluster-backup
      - kscore-identity
      - kscore-federation
      - kscore-blueprint
      - kscore-blueprint-publish
      - kscore-blueprint-state
      - kscore-files
      - kscore-files-storage
      - kscore-proxy
      - kscore-backup
      - kscore-events
      - kscore-schedule
      - kscore-upgrade
      - kscore-migrate
      - kscore-bootstrap
      - kscore-runbook
      - kscore-secrets
    vendor: Keystone Core
    homepage: https://github.com/shawnbutts/keystone-core
    maintainer: Spicer Creek Solutions LLC <team@keystonecore.io>
    description: |
      Keystone Core CLI Tools
      Complete set of command-line tools for interacting with Keystone Core.
      Includes kscorectl (main CLI) and all plugin commands.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      - src: deploy/completions/kscorectl.bash
        dst: /usr/share/bash-completion/completions/kscorectl
        type: config
      - src: deploy/completions/kscorectl.zsh
        dst: /usr/share/zsh/site-functions/_kscorectl
        type: config

# Checksum configuration
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Snapshot configuration for development builds
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Security
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

# Release configuration
release:
  github:
    owner: kscore
    name: keystone-core
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Keystone Core {{ .Version }}

    Welcome to Keystone Core {{ .Version }}! This release includes the following changes:
  footer: |
    ## Installation

    ### Binary Installation
    Download the appropriate archive for your platform from the assets below.

    ### Package Installation (Linux)
    ```bash
    # Debian/Ubuntu
    sudo dpkg -i kscore-server_{{ .Version }}_linux_amd64.deb
    sudo dpkg -i kscore-agent_{{ .Version }}_linux_amd64.deb
    sudo dpkg -i kscore-cli_{{ .Version }}_linux_amd64.deb

    # RHEL/CentOS/Fedora
    sudo rpm -i kscore-server-{{ .Version }}.x86_64.rpm
    sudo rpm -i kscore-agent-{{ .Version }}.x86_64.rpm
    sudo rpm -i kscore-cli-{{ .Version }}.x86_64.rpm
    ```

    ### Docker
    ```bash
    docker pull ghcr.io/kscore/kscore-server:{{ .Version }}
    docker pull ghcr.io/kscore/kscore-agent:{{ .Version }}
    ```

    ## Documentation
    Full documentation is available at https://docs.keystonecore.io

    ## Verifying This Release

    All release artifacts are signed offline by multiple parties.
    See [RELEASE-PLAYBOOK.md](https://github.com/shawnbutts/keystone-core/blob/main/RELEASE-PLAYBOOK.md) for the full process.

    ```bash
    # Import release public key
    gpg --import keys/release-pubkey.asc

    # Verify checksum signatures
    gpg --verify checksums.txt.sig.A checksums.txt

    # Verify artifact integrity
    sha256sum -c checksums.txt

    # Verify container images
    cosign verify --key release-cosign.pub ghcr.io/kscore/kscore-server:{{ .Version }}
    ```

    The signed release record (`release-record-v{{ .Version }}.txt`) and
    SBOMs are included with this release.

    ## Checksums
    SHA256 checksums are available in `checksums.txt`
