# Keystone Core GoReleaser Configuration
# Documentation: https://goreleaser.com

version: 2

project_name: keystone-core

before:
  hooks:
    - go mod tidy
    - go generate ./...

# Build configuration for all binaries
builds:
  # Server daemons
  - id: kscore-server
    binary: kscore-server
    main: ./cmd/kscore-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags: &ldflags
      - -s -w
      - -X github.com/shawnbutts/keystone-core/pkg/version.Version={{.Version}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/shawnbutts/keystone-core/pkg/version.BuildDate={{.Date}}

  - id: kscore-agent
    binary: kscore-agent
    main: ./cmd/kscore-agent
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: *ldflags

