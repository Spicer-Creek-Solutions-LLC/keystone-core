# CI for Forgejo Actions (local) and the GitHub code-only mirror.
#
# All work runs through Make targets per PROJECT-DETAILS §5.4:
# "CI never runs raw `go test`/`go build` — always Make targets."
#
# Codeberg CI lives separately in .woodpecker/ — same Make targets,
# different runner.
#
# Security: every ${{ ... }} expansion below references either matrix
# values defined in this file or github.ref (a refname, not user
# content). No issue/PR/commit body text is interpolated into shell.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Build golangci-lint with the runner's Go toolchain so the binary's
      # build-time Go version matches go.mod's `go` directive. Avoids the
      # "Go language version (goX.Y) used to build golangci-lint is lower
      # than the targeted Go version" error from prebuilt binaries.
      - run: make install-tools
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test (race + coverage)
        run: make test-coverage

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make smoke

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@v1
      - name: install proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - run: make proto-lint
      - name: regenerate + verify clean
        run: |
          make proto
          git diff --exit-code

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build
