# Keystone Core Release Workflow (DEPRECATED)
#
# IMPORTANT: This automated workflow is DEPRECATED for official releases.
# Official releases MUST follow the offline multi-party signing ceremony
# defined in RELEASE-PLAYBOOK.md. That process requires air-gapped builds,
# multi-party verification, and offline GPG/Cosign signing — none of which
# can be performed in CI/CD.
#
# This workflow remains available for:
#   - Pre-release snapshot builds (alpha/beta/RC tags)
#   - Generating unsigned development artifacts for internal testing
#
# DO NOT use artifacts produced by this workflow as official releases.
# See: RELEASE-PLAYBOOK.md

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'
  CGO_ENABLED: '1'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Set extension for Windows
          EXT=""
          if [ "$GOOS" == "windows" ]; then
            EXT=".exe"
          fi

          # Build server and agent
          for binary in kscore-server kscore-agent; do
            if [ -d "cmd/${binary}" ]; then
              echo "Building ${binary} for ${GOOS}/${GOARCH}..."
              go build -ldflags="-s -w -X main.version=${VERSION}" \
                -o dist/${binary}-${GOOS}-${GOARCH}${EXT} \
                ./cmd/${binary}
            fi
          done

          # Build CLI tools
          for binary in kscorectl kscore-exec kscore-state kscore-monitor kscore-cluster; do
            if [ -d "cmd/${binary}" ]; then
              echo "Building ${binary} for ${GOOS}/${GOARCH}..."
              go build -ldflags="-s -w -X main.version=${VERSION}" \
                -o dist/${binary}-${GOOS}-${GOARCH}${EXT} \
                ./cmd/${binary}
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/kscore-server:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/kscore-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build and push agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/kscore-agent:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/kscore-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to ${{ steps.version.outputs.VERSION }}"
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" > CHANGELOG.md
          else
            echo "First release"
            echo "- Initial release" > CHANGELOG.md
          fi

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Keystone Core ${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
