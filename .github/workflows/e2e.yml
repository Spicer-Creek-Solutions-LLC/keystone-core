# Keystone Core E2E Tests
# Runs containerized E2E tests using Docker Compose

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      topology:
        description: 'Test topology to run'
        required: false
        default: 'all-in-one'
        type: choice
        options:
          - all-in-one
          - ha-cluster
          - all
      run_perf:
        description: 'Run performance tests'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.21'
  CGO_ENABLED: '1'
  DOCKER_BUILDKIT: '1'
  COMPOSE_DOCKER_CLI_BUILD: '1'

jobs:
  e2e-all-in-one:
    name: E2E - All-in-One
    runs-on: ubuntu-latest
    if: github.event.inputs.topology != 'ha-cluster'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          cd test/e2e/containers
          docker compose build --parallel
        timeout-minutes: 10

      - name: Run E2E tests (all-in-one topology)
        env:
          KSCORE_E2E_TESTS: '1'
          KSCORE_ROOT: ${{ github.workspace }}
        run: |
          # Run topology tests
          go test -v -timeout 20m \
            ./test/e2e/topology/... \
            -run "TestAllInOne"
        timeout-minutes: 20

      - name: Run scenario tests
        env:
          KSCORE_E2E_TESTS: '1'
          KSCORE_ROOT: ${{ github.workspace }}
          KSCORE_SKIP_BUILD: '1'
        run: |
          go test -v -timeout 15m ./test/e2e/scenarios/...
        timeout-minutes: 15

      - name: Collect logs on failure
        if: failure()
        run: |
          cd test/e2e/containers
          docker compose logs --tail=500 > docker-logs.txt 2>&1 || true
          docker compose ps -a > container-status.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-all-in-one
          path: |
            test/e2e/containers/docker-logs.txt
            test/e2e/containers/container-status.txt
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          cd test/e2e/containers
          docker compose down -v --remove-orphans 2>/dev/null || true
          docker system prune -f 2>/dev/null || true

  e2e-ha-cluster:
    name: E2E - HA Cluster
    runs-on: ubuntu-latest
    if: github.event.inputs.topology == 'ha-cluster' || github.event.inputs.topology == 'all'
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          cd test/e2e/containers
          docker compose -f docker-compose.ha.yml build --parallel 2>/dev/null || \
          docker compose build --parallel
        timeout-minutes: 15

      - name: Run HA cluster tests
        env:
          KSCORE_E2E_TESTS: '1'
          KSCORE_ROOT: ${{ github.workspace }}
          TOPOLOGY: 'ha-cluster'
        run: |
          go test -v -timeout 30m \
            ./test/e2e/topology/... \
            -run "TestHACluster"
        timeout-minutes: 30

      - name: Collect logs on failure
        if: failure()
        run: |
          cd test/e2e/containers
          docker compose -f docker-compose.ha.yml logs --tail=500 > docker-logs.txt 2>&1 || \
          docker compose logs --tail=500 > docker-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-ha-cluster
          path: test/e2e/containers/docker-logs.txt
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          cd test/e2e/containers
          docker compose -f docker-compose.ha.yml down -v --remove-orphans 2>/dev/null || \
          docker compose down -v --remove-orphans 2>/dev/null || true

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.run_perf == true || github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          cd test/e2e/containers
          docker compose build --parallel
        timeout-minutes: 10

      - name: Run performance tests
        env:
          KSCORE_E2E_TESTS: '1'
          KSCORE_PERF_TESTS: '1'
          KSCORE_ROOT: ${{ github.workspace }}
        run: |
          go test -v -timeout 30m ./test/e2e/performance/...
        timeout-minutes: 30

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: test/e2e/performance/reports/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          cd test/e2e/containers
          docker compose down -v --remove-orphans 2>/dev/null || true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: |
          # Run tests that don't require containers
          go test -v -timeout 15m \
            ./pkg/statemgmt/... \
            ./pkg/events/... \
            ./pkg/policy/... \
            -run "Integration"
        timeout-minutes: 15

  results:
    name: Test Results Summary
    needs: [e2e-all-in-one, performance, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "E2E All-in-One: ${{ needs.e2e-all-in-one.result }}"
          echo "Performance: ${{ needs.performance.result }}"
          echo "Integration: ${{ needs.integration.result }}"

          # Fail if any required job failed
          if [ "${{ needs.e2e-all-in-one.result }}" == "failure" ]; then
            echo "E2E tests failed!"
            exit 1
          fi
          if [ "${{ needs.integration.result }}" == "failure" ]; then
            echo "Integration tests failed!"
            exit 1
          fi

          echo "All tests passed!"
