# golangci-lint configuration — v1.0 baseline
# https://golangci-lint.run/usage/configuration/
#
# Linter set per PROJECT-DETAILS.md §3.5 / epics/01-foundations.md task 10.
# Deferred to v1.1: revive, exhaustive, gocritic, contextcheck, durationcheck,
# rowserrcheck, sqlclosecheck. Owning epics add path-specific exclusions as
# their packages land.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - goheader

  settings:
    goheader:
      template: |-
        SPDX-License-Identifier: Apache-2.0

    errcheck:
      exclude-functions:
        # fmt.Print* to stdout/stderr rarely fail and are typically not checked
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Hash writes never fail
        - (hash.Hash).Write
        # String builder writes never fail
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteRune
        - (*strings.Builder).WriteByte
        # Buffer writes to memory never fail
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        # Close methods in defer are commonly unchecked
        - (*os.File).Close
        - (io.Closer).Close

    gosec:
      excludes:
        - G104  # Handled by errcheck
        - G115  # gosec v2.23.0 RangeAnalyzer panics on float-to-int casts
                # (securego/gosec#1229). Fixed in gosec v2.24.0 but
                # golangci-lint v2.10.1 still bundles v2.23.0. Re-enable when
                # golangci-lint upgrades gosec.

  exclusions:
    rules:
      # Test files: exempt from gosec / errcheck (per PROJECT-DETAILS §3.5)
      - path: _test\.go
        linters:
          - gosec
          - errcheck

      # Generated proto: all linters disabled (per PROJECT-DETAILS §3.5)
      - path: \.pb\.go
        linters:
          - all

# gofmt as a gate, not a suggestion. Without it the tree drifts
# silently on a toolchain bump: Go 1.27's gofmt reformats struct-field
# alignment and doc-comment lists, and 127 files had drifted before
# anyone noticed, because nothing was checking.
#
# Generated protobuf is excluded -- it is formatted by protoc-gen-go,
# and reformatting it would be undone on the next regeneration.
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
