# changie config — https://changie.dev
#
# Per-PR changelog entries are drafted as YAML fragments under
# .changes/unreleased/ instead of editing CHANGELOG.md directly.
# At release time, `make changelog-batch VERSION=v0.x.y` aggregates
# every unreleased fragment into CHANGELOG.md under that version
# heading, then archives the fragments to .changes/v0.x.y/.
#
# Why fragments instead of editing CHANGELOG.md per-PR: every PR
# editing the same section caused mechanical merge conflicts whenever
# two PRs landed back-to-back. Fragments give each PR its own file;
# git auto-merges trivially. See CONTRIBUTING.md § Changelog entries.

changesDir: .changes
unreleasedDir: unreleased
changelogPath: CHANGELOG.md
versionExt: md

# headerPath restores the persistent top-of-file content (Changelog
# header + Keep-a-Changelog preamble + [Unreleased] + [v1.0.0] —
# Planned) that `changie merge` would otherwise wipe. Without this,
# every `make changelog-batch VERSION=v0.x.y` rewrites CHANGELOG.md
# with only the concatenated per-version files. Discovered + fixed
# post-v0.1.0; see RELEASE-PLAYBOOK §3 v0.1.0 release record.
# Path relative to changesDir.
#
# Markdown reference links ([Unreleased]: …, [v0.1.0]: …, etc.) live
# at the END of the OLDEST per-version file (`.changes/v0.1.0.md`)
# because changie has no file-level footer (only per-version footers
# via `versionFooterPath`). When a new version ships, the
# `[Unreleased]:` link inside v0.1.0.md needs its compare-base
# updated by hand from v<prev>...HEAD to v<new>...HEAD, and the new
# `[v<new>]:` link added; tracked as a v0.x ROADMAP entry for
# `replacements:`-driven automation.
headerPath: header.tpl.md

# Output formatting — keep aligned with the existing keep-a-changelog
# style. The em-dash + date matches the [v0.1.0] header already in
# CHANGELOG.md. The change template indents continuation lines by 2
# spaces so multi-line bodies render as proper markdown bullet
# continuations (single-line bodies are unaffected).
versionFormat: '## [{{.Version}}] — {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body | replace "\n" "\n  "}}'

# Optional per-fragment metadata. `Demo` opts an entry into the promo
# video's shot list (assets/promo/manifest.yaml): set it to the shot
# `feature` tag that would show the change on screen. `make promo-check`
# reports a tagged entry with no shot.
#
# Why opt-in rather than mined from the body: changelog bodies describe
# behaviour, not demoability. A PR author who just built the feature
# knows whether it reads in four seconds of terminal output; a heuristic
# over the prose does not. Leave it unset for anything that is not
# visible in a terminal — most entries.
custom:
  - key: Demo
    label: "Demo shot (optional — promo video feature tag, blank for none)"
    type: string
    optional: true

kinds:
  - label: Security
  - label: Added
  - label: Changed
  - label: Fixed
  - label: Docs

newlines:
  afterChangelogVersion: 1
  beforeChangelogVersion: 1
  afterKind: 1
  beforeKind: 1
  afterChange: 0
  beforeChange: 0

# Migration note: the .changes/unreleased/ tree at PR-merge time
# represents the [Unreleased] section that previously lived inline
# in CHANGELOG.md. Running `make changelog-preview` renders the
# current accumulated set without writing CHANGELOG.md.
