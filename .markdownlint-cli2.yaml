config:
  default: true
  MD013: false # line length — long prose lines are fine
  MD033: false # inline HTML
  MD024: false # duplicate headings (e.g. repeated "### Done" / "### Targeted: …" subsections)
  MD036: false # emphasis used instead of a heading (we use **bold** lead-ins in list items deliberately)
  MD037: false # spaces inside emphasis markers — false-positives on prose with literal `*` (e.g. `state.*`, `--postgres-*`)
  MD040: false # fenced code language
  MD001: false # heading-increment — ROADMAP.md deliberately nests `#### entry` directly under `## <bucket>`
  MD060: false

globs:
  # Every tracked Markdown file. The narrower `docs/**` + `*.md` pair this
  # replaced left ten files unlinted, the active epic and the issue templates
  # among them, and nothing said so.
  - "**/*.md"

# Lint tracked project content only. Without this the glob also picks up
# gitignored build output and local agent scratch files, so whether the gate
# passes depends on what happens to be lying around in a working tree.
gitignore: true

ignores:
  # CLAUDE.md is a one-line `@AGENTS.md` Claude Code import directive — a
  # leading H1 would break the import semantics, so MD041 will always fail.
  - "CLAUDE.md"
