# Forgejo issue-tracker label set for keystone-core.
#
# Authoritative definition consumed by `trackerctl sync-labels`. Editing this
# file and re-running the sync is how the label set evolves — on the test
# server now, on the production server at announcement time (cutover model b:
# prod is a clean regeneration from this config, not a repo migration).
#
# `exclusive: true` on a namespaced (`foo/bar`) label tells Forgejo to enforce
# at most one label from that namespace per issue.
#
# See docs/project/ISSUE-TRACKING.md for what these mean and when to apply them.

# --- source/* : which planning document owns the work (drives close-out) ---
- name: source/v1x-backlog
  color: "1d76db"
  exclusive: true
  description: Originated from docs/project/ROADMAP.md
- name: source/features
  color: "1d76db"
  exclusive: true
  description: Originated from FEATURES.md
- name: source/roadmap
  color: "1d76db"
  exclusive: true
  description: Originated from PROJECT-DETAILS.md §6.2 / roadmap
- name: source/epic-task
  color: "1d76db"
  exclusive: true
  description: Tracked by an epics/NN-*.md task
- name: source/triage
  color: "1d76db"
  exclusive: true
  description: Filed directly (bug or idea), not from a planning doc

# --- kind/* : the shape of the issue ---
- name: kind/epic
  color: "5319e7"
  exclusive: true
  description: "Epic tracker issue: ordered task list of child tickets"
- name: kind/release-tracker
  color: "5319e7"
  exclusive: true
  description: "Per-release tracker issue: ordered list of epics + tickets"
- name: kind/feature
  color: "5319e7"
  exclusive: true
  description: Feature work
- name: kind/bug
  color: "5319e7"
  exclusive: true
  description: Bug fix
- name: kind/chore
  color: "5319e7"
  exclusive: true
  description: Chore / maintenance
- name: kind/docs
  color: "5319e7"
  exclusive: true
  description: Documentation

