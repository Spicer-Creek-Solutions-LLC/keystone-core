# Execution order for per-bucket tracker issues, consumed by
# `trackerctl gen-tracker --version <bucket>`.
#
# Keys are priority buckets (matching docs/project/ROADMAP.md section
# headings and the per-entry `Priority:` field); values are backlog `####`
# entry titles in the order they should appear in that bucket's tracker
# issue (first = work on next). Titles must match the headings in
# docs/project/ROADMAP.md exactly.
#
# A bucket absent here falls back to ROADMAP.md file order. A backlog entry
# for the bucket that is missing from its list is appended at the end with a
# warning. A title here that matches no backlog entry is reported and ignored.
#
# This is the canonical execution order referenced by docs/project/ISSUE-TRACKING.md §5;
# reorder here (or in the `## <bucket>` section of ROADMAP.md) and re-run gen-tracker.

