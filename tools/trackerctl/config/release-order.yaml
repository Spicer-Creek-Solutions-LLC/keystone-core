# Execution order for per-release tracker issues, consumed by
# `trackerctl gen-tracker --version vX.Y`.
#
# Keys are version tags; values are backlog `####` entry titles in the order
# they should appear in that release's tracker issue (first = work on next).
# Titles must match the headings in docs/project/V1X-BACKLOG.md exactly.
#
# A version absent here falls back to backlog file order. A backlog entry for
# the version that is missing from its list is appended at the end with a
# warning. A title here that matches no backlog entry is reported and ignored.
#
# This is the canonical execution order referenced by docs/project/ISSUE-TRACKING.md §5;
# reorder here (or in the `## vX.Y` section of V1X-BACKLOG.md) and re-run gen-tracker.

