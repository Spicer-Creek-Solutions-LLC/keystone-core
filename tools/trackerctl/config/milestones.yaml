# Forgejo milestones for keystone-core, consumed by `trackerctl sync-milestones`.
#
# One milestone per priority bucket (matching docs/project/ROADMAP.md section
# headings and the per-entry `Priority:` field). `due_on` is optional (RFC3339
# timestamp); omit it for no due date.
#
# Having a milestone here does NOT mean its tickets should exist yet: decompose
# a bucket into leaf issues when it becomes the active or next focus
# (docs/project/ISSUE-TRACKING.md §3). `trackerctl gen-issues --versions gate-v0.5`
# controls which buckets actually get issues created.
#
# Buckets below mirror docs/project/VERSIONING.md (which defines what each
# milestone means). Update there first; reflect here.

- title: gate-v0.5
  description: >-
    Blocks the v0.5 external-tester milestone. Cross-Linux-distro support,
    netplan + networkd persistence, all firewall backends solid, apt+dnf+apk
    package coverage, AppArmor in security, cross-distro reboot detection,
    filesystem-resize + LV resize. Must land before v0.5 ships. See
    docs/project/VERSIONING.md and the `## gate-v0.5` section of
    docs/project/ROADMAP.md.

- title: gate-v1.0
  description: >-
    Blocks the v1.0 SemVer-stability commitment. Production polish + epic
    completion items: schema versioning, replay protection, RBAC CRUD, multi-
    table transactions, reactor + event lifecycle, file distribution
    backends, backup orchestration, bootstrap polish, systemd integration,
    transactional API key issuance, multi-table transaction wrapper. Must
    land in the v0.x line between v0.5 and v1.0. See
    docs/project/VERSIONING.md and the `## gate-v1.0` section of
    docs/project/ROADMAP.md.

- title: v0.x
  description: >-
    Desirable pre-v1.0 items with no specific gate. Land opportunistically in
    v0.x releases as effort permits. Stdlib enhancements (per-field cron, more
    config formats, archive absent state, etc.), UX improvements, doc cleanup.
    See the `## v0.x` section of docs/project/ROADMAP.md.

- title: v1.x
  description: >-
    Post-v1.0 feature additions on the stable v1.0 line. Windows agent, WASM
    runtime, TUI monitor, macOS agent, K8s operator + CRDs, SPIRE-backed
    identity, telemetry gateway, saga checkpoint-resume, policy enforcement
    modes, air-gap baseline. See the `## v1.x` section of
    docs/project/ROADMAP.md.

- title: v2.x+
  description: >-
    Architectural post-v1.0. NATS supercluster + leaf nodes + WebSocket +
    auto-discovery, cross-domain federation, cloud KMS for secrets (AWS
    Secrets Manager / Azure Key Vault / GCP Secret Manager backends), DNS
    provider management, advanced networking, proxy-agent core (SSH/SNMP/REST
    + initial vendors), MCP server. Marketplace + Web UI + multi-cloud test
    matrix in v3.0+. See the `## v2.x+` section of docs/project/ROADMAP.md.
