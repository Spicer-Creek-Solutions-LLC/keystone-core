# Keystone Core Telemetry Gateway Configuration
# Docker Compose setup with Prometheus, Loki, and Tempo

nats:
  urls:
    - "nats://nats:4222"
  cluster: "default"
  max_reconnects: -1
  reconnect_wait: 2s

server:
  listen: ":8080"
  metrics_path: "/metrics"
  health_path: "/health"
  ready_path: "/ready"
  federate_path: "/federate"
  read_timeout: 30s
  write_timeout: 30s

metrics:
  enabled: true
  subject: "keystone.metrics.>"
  stale_timeout: 5m
  cardinality:
    max_series: 100000
    max_labels_per_series: 20
    drop_high_cardinality: false

logs:
  enabled: true
  subject: "keystone.logs.>"
  loki:
    enabled: true
    url: "http://loki:3100/loki/api/v1/push"
    batch_size: 100
    batch_wait: 5s

traces:
  enabled: true
  subject: "keystone.traces.>"
  otlp:
    enabled: true
    endpoint: "http://tempo:4318/v1/traces"
    compression: gzip
    batch_size: 100
    flush_interval: 5s

ha:
  enabled: false
  queue_group: "kscore-gateway"
