version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: kscore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./alerts:/etc/prometheus/alerts
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - kscore

  grafana:
    image: grafana/grafana:latest
    container_name: kscore-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - ALERT_EMAIL_ADDRESSES=${ALERT_EMAIL_ADDRESSES:-alerts@example.com}
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting
      - ./dashboards:/etc/grafana/provisioning/dashboards/kscore
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - kscore

volumes:
  prometheus-data:
  grafana-data:

networks:
  kscore:
    name: kscore
    driver: bridge
