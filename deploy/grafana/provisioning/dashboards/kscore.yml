apiVersion: 1

providers:
  - name: 'Keystone Core Dashboards'
    orgId: 1
    folder: 'Keystone Core'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/kscore
      foldersFromFilesStructure: false
