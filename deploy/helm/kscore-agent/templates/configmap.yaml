apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kscore-agent.fullname" . }}-config
  labels:
    {{- include "kscore-agent.labels" . | nindent 4 }}
data:
  agent.yaml: |
    # Keystone Core Agent Configuration
    # Generated by Helm

    # Server connection
    server:
      address: {{ .Values.server.address | quote }}
      {{- if .Values.server.tls.enabled }}
      tls:
        enabled: true
        insecureSkipVerify: {{ .Values.server.tls.insecureSkipVerify }}
        {{- if .Values.server.tls.certSecretName }}
        certFile: "/etc/kscore/tls/tls.crt"
        keyFile: "/etc/kscore/tls/tls.key"
        {{- end }}
        {{- if .Values.server.tls.caSecretName }}
        caFile: "/etc/kscore/tls/ca.crt"
        {{- end }}
      {{- end }}

    # Agent settings
    agent:
      # ID is set via environment variable KSCORE_AGENT_ID
      {{- with .Values.agent.labels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.metadata }}
      metadata:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      heartbeatInterval: {{ .Values.agent.heartbeatInterval | quote }}
      reconnectWait: {{ .Values.agent.reconnectWait | quote }}
      maxReconnects: {{ .Values.agent.maxReconnects }}

    # NATS connection
    nats:
      mode: {{ .Values.nats.mode | quote }}
      {{- if eq .Values.nats.mode "direct" }}
      url: {{ include "kscore-agent.natsUrl" . | quote }}
      {{- end }}
      {{- if .Values.nats.auth.enabled }}
      auth:
        enabled: true
        {{- if .Values.nats.auth.tokenSecretName }}
        # Token is set via NATS_TOKEN environment variable
        {{- end }}
        {{- if .Values.nats.auth.credentialsSecretName }}
        credentialsFile: "/etc/kscore/nats.creds"
        {{- end }}
      {{- end }}
      {{- if .Values.nats.embedded.enabled }}
      embedded:
        enabled: true
        port: {{ .Values.nats.embedded.port }}
        {{- if .Values.nats.embedded.remoteUrl }}
        remoteUrl: {{ .Values.nats.embedded.remoteUrl | quote }}
        {{- end }}
      {{- end }}

    # Execution settings
    execution:
      workDir: {{ .Values.execution.workDir | quote }}
      {{- if .Values.execution.shell }}
      shell: {{ .Values.execution.shell | quote }}
      {{- end }}
      timeout: {{ .Values.execution.timeout | quote }}
      allowPrivileged: {{ .Values.execution.allowPrivileged }}

    {{- if .Values.state.enabled }}
    # State management
    state:
      enabled: true
      stateDir: {{ .Values.state.stateDir | quote }}
      cacheDir: {{ .Values.state.cacheDir | quote }}
    {{- end }}

    # Logging
    logging:
      level: {{ .Values.logging.level | quote }}
      format: {{ .Values.logging.format | quote }}
      output: {{ .Values.logging.output | quote }}

    # Telemetry
    {{- if .Values.telemetry.enabled }}
    telemetry:
      enabled: true
      {{- if .Values.telemetry.prometheus.enabled }}
      prometheus:
        enabled: true
        port: {{ .Values.telemetry.prometheus.port }}
        path: {{ .Values.telemetry.prometheus.path | quote }}
      {{- end }}
    {{- end }}
