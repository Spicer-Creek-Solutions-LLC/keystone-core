{{- if and (eq .Values.storage.backend "postgresql") .Values.storage.postgresql.password (not .Values.storage.postgresql.passwordSecretName) (not .Values.postgresql.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kscore-server.fullname" . }}-postgresql
  labels:
    {{- include "kscore-server.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.storage.postgresql.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.auth.enabled (eq .Values.auth.type "apikey") .Values.auth.apiKey.keys (not .Values.auth.apiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kscore-server.fullname" . }}-apikeys
  labels:
    {{- include "kscore-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  apikeys.yaml: |
    {{- toYaml .Values.auth.apiKey.keys | nindent 4 }}
{{- end }}
---
{{- if and .Values.webhook.enabled (eq .Values.webhook.authType "hmac") .Values.webhook.hmacSecret (not .Values.webhook.hmacSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kscore-server.fullname" . }}-webhook
  labels:
    {{- include "kscore-server.labels" . | nindent 4 }}
type: Opaque
data:
  webhook-secret: {{ .Values.webhook.hmacSecret | b64enc | quote }}
{{- end }}
---
{{- if and .Values.webhook.enabled (eq .Values.webhook.authType "bearer") .Values.webhook.bearerToken (not .Values.webhook.bearerTokenSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kscore-server.fullname" . }}-webhook-token
  labels:
    {{- include "kscore-server.labels" . | nindent 4 }}
type: Opaque
data:
  webhook-token: {{ .Values.webhook.bearerToken | b64enc | quote }}
{{- end }}
