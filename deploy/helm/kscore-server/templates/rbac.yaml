{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kscore-server.fullname" . }}
  labels:
    {{- include "kscore-server.labels" . | nindent 4 }}
rules:
  # ConfigMaps for leader election and coordination
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leases for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events for audit logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kscore-server.fullname" . }}
  labels:
    {{- include "kscore-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kscore-server.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kscore-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
