{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kscore-telemetry-gateway.fullname" . }}
  labels:
    {{- include "kscore-telemetry-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kscore-telemetry-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus scraping
    - ports:
        - protocol: TCP
          port: 9091
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow NATS
    - ports:
        - protocol: TCP
          port: 4222
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
