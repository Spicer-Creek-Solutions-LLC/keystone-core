# Keystone Core Telemetry Gateway Configuration
# See https://docs.keystonecore.io/docs/reference/configuration/ for full reference

# NATS connection settings
nats:
  # URLs to connect to NATS (supports multiple for failover)
  urls:
    - "nats://localhost:4222"
  # Cluster name for subject prefixing
  cluster: "default"
  # Optional: Credentials file
  # credentials_file: /etc/keystone-core/nats.creds
  # Optional: TLS configuration
  # tls:
  #   enabled: true
  #   cert_file: /etc/keystone-core/client.crt
  #   key_file: /etc/keystone-core/client.key
  #   ca_file: /etc/keystone-core/ca.crt
  # Reconnect settings
  max_reconnects: -1
  reconnect_wait: 2s

# HTTP server settings
server:
  # Address to listen on
  listen: "0.0.0.0:9091"
  # Endpoint paths
  metrics_path: /metrics
  health_path: /health
  ready_path: /ready
  federate_path: /federate
  # Timeouts
  read_timeout: 30s
  write_timeout: 30s

# Metrics gateway configuration
metrics:
  # Enable metrics gateway
  enabled: true
  # NATS subject for metrics
  subject: "kscore.telemetry.metrics.>"
  # Remove agents not seen for this duration
  stale_timeout: 60s
  # Cardinality control
  cardinality:
    max_series: 100000
    max_labels_per_series: 20
    drop_high_cardinality: false
  # Federation settings
  federation:
    enabled: true
    path: /federate
  # Optional: Label transformations
  # labels:
  #   add:
  #     cluster: "prod-us-east-1"
  #   drop:
  #     - internal_metric
  #   rewrite:
  #     - source: old_name
  #       target: new_name
  # Optional: Remote write to Prometheus-compatible backends
  # remote_write:
  #   enabled: true
  #   url: "http://prometheus:9090/api/v1/write"
  #   batch_size: 1000
  #   flush_interval: 15s

# Logs gateway configuration
logs:
  # Enable logs gateway
  enabled: true
  # NATS subject for logs
  subject: "kscore.telemetry.logs.>"
  # Minimum log level to store (debug, info, warn, error)
  min_level: "info"
  # Optional: Source filtering
  # sources:
  #   include: []
  #   exclude: []
  # Optional: Push to Loki
  # loki:
  #   enabled: true
  #   url: "http://loki:3100/loki/api/v1/push"
  #   batch_size: 100
  #   batch_wait: 1s
  # Optional: Push to Elasticsearch
  # elasticsearch:
  #   enabled: true
  #   urls:
  #     - "http://elasticsearch:9200"
  #   index: "kscore-logs-%Y.%m.%d"
  #   batch_size: 500

# Traces gateway configuration
traces:
  # Enable traces gateway
  enabled: true
  # NATS subject for traces
  subject: "kscore.telemetry.traces.>"
  # Sampling configuration
  sampling:
    enabled: true
    rate: 1.0
    priority_sample:
      errors: true
      slow_threshold: 1s
  # Optional: Export to OTLP endpoint (Tempo, Jaeger, etc.)
  # otlp:
  #   enabled: true
  #   endpoint: "http://tempo:4318/v1/traces"
  #   protocol: grpc
  #   compression: gzip
  #   batch_size: 100
  #   flush_interval: 5s

# High availability configuration
ha:
  # Enable HA mode
  enabled: false
  # Queue group name
  queue_group: "kscore-gateway"
  # Leader election settings
  # leader_election:
  #   enabled: true
  #   lease_duration: 15s
  #   renew_deadline: 10s
