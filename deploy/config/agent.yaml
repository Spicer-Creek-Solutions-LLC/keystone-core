# Keystone Core Agent Configuration
# See https://docs.kscore.dev/docs/reference/configuration/ for full reference

# Agent identification
agent:
  # Unique agent ID (auto-generated if not specified)
  # id: my-agent-01
  # Agent tags for targeting
  tags:
    role: default
    # environment: production
    # datacenter: us-east-1

# Control plane connection
server:
  # NATS URL(s) for connecting to control plane
  urls:
    - nats://localhost:4222
  # Credentials file (if authentication is enabled)
  # credentials_file: /etc/keystone-core/agent.creds
  # TLS configuration
  # tls:
  #   enabled: true
  #   ca_file: /etc/keystone-core/ca.crt
  #   cert_file: /etc/keystone-core/agent.crt
  #   key_file: /etc/keystone-core/agent.key

# Heartbeat configuration
heartbeat:
  # Interval between heartbeats
  interval: 30s
  # Timeout before agent is considered offline
  timeout: 90s

# Execution configuration
execution:
  # Default shell for command execution
  shell: /bin/bash
  # Command timeout
  timeout: 5m
  # Working directory for commands
  workdir: /tmp

# State management configuration
state:
  # Cache directory for state files
  cache_dir: /var/cache/keystone-core/states
  # Enable local state caching
  cache_enabled: true

# Logging configuration
logging:
  # Level: debug, info, warn, error
  level: info
  # Format: json, logfmt, text
  format: json
  # Output: stdout, stderr, or file path
  output: /var/log/keystone-core/agent.log

# Facts collection
facts:
  # Enable automatic fact collection
  enabled: true
  # Refresh interval
  refresh_interval: 5m
  # Custom facts script (optional)
  # custom_script: /etc/keystone-core/custom-facts.sh
