apiVersion: v1
kind: ConfigMap
metadata:
  name: kscore-registry
  namespace: keystone-core
  labels:
    app.kubernetes.io/name: kscore-registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: keystone-core
data:
  registry.yaml: |
    # Server settings
    server:
      listen_address: "0.0.0.0:8081"

    # Storage settings
    storage:
      data_dir: /var/lib/keystone-core/registry
      max_upload_size: 104857600

    # Authentication settings
    auth:
      enabled: false

    # Security settings
    security:
      read_only: false
      cors_enabled: true

    # Logging configuration
    logging:
      level: info
      format: json
      output: stdout

    # Telemetry configuration
    telemetry:
      enabled: true
      prometheus:
        enabled: true
        path: /metrics
