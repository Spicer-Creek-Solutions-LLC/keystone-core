apiVersion: v1
kind: ServiceAccount
metadata:
  name: kscore-server
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-server
    app.kubernetes.io/component: control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kscore-server
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-server
    app.kubernetes.io/component: control-plane
rules:
  # ConfigMaps for leader election
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leases for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events for audit logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kscore-server
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-server
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kscore-server
subjects:
  - kind: ServiceAccount
    name: kscore-server
    namespace: kscore-system
