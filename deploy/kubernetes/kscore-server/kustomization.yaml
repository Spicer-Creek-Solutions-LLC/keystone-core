apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kscore-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-server.yaml

commonLabels:
  app.kubernetes.io/part-of: keystone-core
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/keystone-core/kscore-server
    newTag: latest
