apiVersion: apps/v1
kind: Deployment
metadata:
  name: kscore-server
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-server
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kscore-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kscore-server
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kscore-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kscore-server
          image: ghcr.io/keystone-core/kscore-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/kscore/server.yaml"
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: nats
              containerPort: 4222
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/kscore
              readOnly: true
            - name: data
              mountPath: /var/lib/kscore
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kscore-server-config
        - name: data
          persistentVolumeClaim:
            claimName: kscore-server-data
        - name: tmp
          emptyDir: {}
