apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: keystone-core
    app.kubernetes.io/component: network-policy
spec:
  # Apply to all pods in the namespace
  podSelector: {}
  policyTypes:
    - Ingress
  # No ingress rules means deny all ingress by default
  # Explicit allow rules are defined in component-specific policies
