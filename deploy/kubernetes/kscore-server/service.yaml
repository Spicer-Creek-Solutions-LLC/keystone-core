apiVersion: v1
kind: Service
metadata:
  name: kscore-server
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-server
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: nats
      port: 4222
      targetPort: nats
      protocol: TCP
  selector:
    app.kubernetes.io/name: kscore-server
