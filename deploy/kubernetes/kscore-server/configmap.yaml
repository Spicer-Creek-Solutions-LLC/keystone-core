apiVersion: v1
kind: ConfigMap
metadata:
  name: kscore-server-config
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-server
    app.kubernetes.io/component: control-plane
data:
  server.yaml: |
    # Keystone Core Server Configuration
    server:
      listenAddr: "0.0.0.0"
      grpcPort: 9090
      httpPort: 8080

    # NATS Configuration (embedded mode for single-node)
    nats:
      mode: embedded
      embedded:
        host: "0.0.0.0"
        port: 4222
        enableJetStream: true
        storeDir: "/var/lib/keystone-core/nats"
        maxMemory: "1Gi"

    # Storage Configuration (SQLite for single-node)
    storage:
      backend: sqlite
      sqlite:
        path: "/var/lib/keystone-core/keystone-core.db"
        wal: true
        busyTimeout: 5000

    # Authentication
    auth:
      enabled: true
      type: apikey
      apiKey:
        headerName: "X-API-Key"
        metadataKey: "x-api-key"
      bypassMethods:
        - "/grpc.health.v1.Health/Check"
        - "/kscore.v1.HealthService/Liveness"
        - "/kscore.v1.HealthService/Readiness"

    # Logging
    logging:
      level: info
      format: json
      output: stdout

    # Telemetry
    telemetry:
      enabled: true
      prometheus:
        enabled: true
        path: "/metrics"
