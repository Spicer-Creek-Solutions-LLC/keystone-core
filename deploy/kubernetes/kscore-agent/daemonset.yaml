apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kscore-agent
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-agent
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kscore-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kscore-agent
        app.kubernetes.io/component: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kscore-agent
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      tolerations:
        # Run on all nodes including masters
        - operator: Exists
      containers:
        - name: kscore-agent
          image: ghcr.io/keystone-core/kscore-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/kscore/agent.yaml"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KSCORE_AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/kscore
              readOnly: true
            - name: workdir
              mountPath: /tmp/kscore
            - name: state
              mountPath: /var/lib/kscore/states
            - name: cache
              mountPath: /var/cache/kscore
            - name: host-root
              mountPath: /host
              readOnly: false
      volumes:
        - name: config
          configMap:
            name: kscore-agent-config
        - name: workdir
          emptyDir: {}
        - name: state
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: host-root
          hostPath:
            path: /
            type: Directory
