apiVersion: v1
kind: Service
metadata:
  name: kscore-agent
  namespace: kscore-system
  labels:
    app.kubernetes.io/name: kscore-agent
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: kscore-agent
