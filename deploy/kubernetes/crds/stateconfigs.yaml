apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stateconfigs.keystonecore.io
spec:
  group: keystonecore.io
  names:
    kind: StateConfig
    listKind: StateConfigList
    plural: stateconfigs
    singular: stateconfig
    shortNames:
    - sconfig
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - target
            - states
            properties:
              target:
                type: object
                properties:
                  namespace:
                    type: string
                  labelSelector:
                    type: string
                  fieldSelector:
                    type: string
                  names:
                    type: array
                    items:
                      type: string
                  container:
                    type: string
                  maxPods:
                    type: integer
              states:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - module
                  properties:
                    name:
                      type: string
                    module:
                      type: string
                    parameters:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    requisites:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
              vars:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              schedule:
                type: string
                pattern: '^(\*|([0-9]|1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9])|\*\/([0-9]|1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9])) (\*|([0-9]|1[0-9]|2[0-3])|\*\/([0-9]|1[0-9]|2[0-3])) (\*|([1-9]|1[0-9]|2[0-9]|3[0-1])|\*\/([1-9]|1[0-9]|2[0-9]|3[0-1])) (\*|([1-9]|1[0-2])|\*\/([1-9]|1[0-2])) (\*|([0-6])|\*\/([0-6]))$'
          status:
            type: object
            properties:
              phase:
                type: string
              lastApplied:
                type: string
                format: date-time
              podsApplied:
                type: integer
              podsSucceeded:
                type: integer
              podsFailed:
                type: integer
              message:
                type: string
              driftDetected:
                type: boolean
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Pods
      type: integer
      jsonPath: .status.podsApplied
    - name: Drift
      type: boolean
      jsonPath: .status.driftDetected
    - name: Last Applied
      type: date
      jsonPath: .status.lastApplied
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
