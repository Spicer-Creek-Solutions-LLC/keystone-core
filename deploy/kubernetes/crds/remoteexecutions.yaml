apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remoteexecutions.keystonecore.io
spec:
  group: keystonecore.io
  names:
    kind: RemoteExecution
    listKind: RemoteExecutionList
    plural: remoteexecutions
    singular: remoteexecution
    shortNames:
    - rexec
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - target
            - command
            properties:
              target:
                type: object
                properties:
                  namespace:
                    type: string
                  labelSelector:
                    type: string
                  fieldSelector:
                    type: string
                  names:
                    type: array
                    items:
                      type: string
                  container:
                    type: string
                  maxPods:
                    type: integer
              command:
                type: array
                items:
                  type: string
              schedule:
                type: string
                pattern: '^(\*|([0-9]|1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9])|\*\/([0-9]|1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9])) (\*|([0-9]|1[0-9]|2[0-3])|\*\/([0-9]|1[0-9]|2[0-3])) (\*|([1-9]|1[0-9]|2[0-9]|3[0-1])|\*\/([1-9]|1[0-9]|2[0-9]|3[0-1])) (\*|([1-9]|1[0-2])|\*\/([1-9]|1[0-2])) (\*|([0-6])|\*\/([0-6]))$'
              timeout:
                type: string
              mode:
                type: string
                enum:
                - pod
                - job
                - node
          status:
            type: object
            properties:
              phase:
                type: string
              startTime:
                type: string
                format: date-time
              completionTime:
                type: string
                format: date-time
              podsExecuted:
                type: integer
              podsSucceeded:
                type: integer
              podsFailed:
                type: integer
              message:
                type: string
              results:
                type: array
                items:
                  type: object
                  properties:
                    podName:
                      type: string
                    namespace:
                      type: string
                    exitCode:
                      type: integer
                    output:
                      type: string
                    error:
                      type: string
                    duration:
                      type: string
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Pods
      type: integer
      jsonPath: .status.podsExecuted
    - name: Succeeded
      type: integer
      jsonPath: .status.podsSucceeded
    - name: Failed
      type: integer
      jsonPath: .status.podsFailed
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
