# Minimal receiver for the outbound-webhook docs clip.
#
# `kscorectl webhook outbound test` and the delivery path POST from the
# CLI process on the host, so the clip needs something on the other end
# that answers 200. nginx's default returns 405 to a POST, which would
# make the shot a picture of a failed delivery.
server {
    listen 80 default_server;
    location / {
        add_header Content-Type application/json always;
        return 200 '{"received":true}';
    }
}
