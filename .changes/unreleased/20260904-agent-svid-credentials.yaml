kind: Added
body: |-
  **The agent now keeps the identity the control plane issues it.**
  The server has been minting a per-agent X509 SVID at bootstrap since
  Epic 09 (`SVIDBootstrapIssuer`) and publishing it, with the private
  key and trust bundle, on the agent's bootstrap-response subject. No
  agent ever subscribed to that subject, so every issued identity was
  dropped on the floor and the only thing authenticating an agent was
  the fleet-wide HMAC key -- which proves fleet membership, not which
  member.

  The agent now subscribes to the response *before* publishing its
  register (the PSK is single-use, so a reply that lands with nobody
  listening strands the agent), and persists the credential to one
  `0600` file via temp-file-and-rename, at
  `/var/lib/kscore-agent/credentials.json` by default or wherever
  `agent.credentialspath` points. A present, unexpired credential makes
  the agent skip its bootstrap publish, which would otherwise be
  rejected against a consumed PSK on every restart.

  This is storage only: NATS messages are still HMAC-authenticated with
  the shared key, so per-agent authorization remains unenforceable
  until the agent signs with this key and the server verifies against
  the CA. See SECURITY-DESIGN.md "Agent identity -- issued, stored, not
  yet enforced".
