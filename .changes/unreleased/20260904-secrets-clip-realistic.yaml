kind: Changed
body: |-
  **The secrets docs clip shows the credential being used, not printed.**
  It previously ended on `secrets get --show-cleartext`, which is not
  something an operator does for its own sake -- printing a password to
  a terminal is precisely what the store exists to avoid. The clip now
  stores a credential, shows it masked at rest, fetches it into a shell
  variable at deploy time, and passes it to `state apply` as a
  `--variable` so it is rendered into an application's env file without
  ever appearing on screen or in the committed state file. Closes on a
  drift check reporting in_sync -- passing the same variable, since the
  check has to render the same declaration. Adds
  scenario/state/app-env.yaml, whose committed content carries a
  placeholder rather than the credential.
