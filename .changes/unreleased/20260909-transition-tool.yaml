kind: Added
body: |-
  **`tools/transition` — Generation 1 tracker retirement (R04).** Snapshots the
  tracker, derives a reviewed allowlist, and closes Generation 1 issues as
  *superseded, not completed*. Dry run is the default; `--apply` additionally
  requires the reviewed allowlist digest on the command line, so a list
  regenerated after review cannot be applied out of habit.

  It never deletes anything. The original title, body, labels, comments and
  milestone of every issue are retained, because they are the archive's record
  of what the project once intended.

  Its own Go module with no dependencies outside the standard library, so it
  survives R08 removing the root module. `make transition-check` reaches it;
  the root module's test and lint targets do not.

  Safety rests on four things: it refuses to act unless host, owner, name and
  numeric repository ID all match the manifest; preconditions are re-checked
  before the first mutation and again before each close; identity is a
  fingerprint over number, original title and creation time rather than a title
  match; and a journal makes an interrupted run resume rather than repeat,
  which matters because commenting is not idempotent on a forge.
