kind: Added
body: |-
  **The E2E topology now enrolls agents the way an operator does, and
  proves the secret path end to end.** `identity.enabled` is on, so the
  scaffold mints a real join token per agent through
  `IdentityService.CreateJoinToken` before writing that agent's config
  -- the actual enrollment sequence, rather than the PSK shortcut.
  Bootstrap then issues each agent an SVID, which is what makes
  per-agent authorization possible at all.

  Two scenarios cover the feature. `TestE2E_AgentSecretRendering`
  applies a state file referencing `{{ secret ... }}` to one agent and
  asserts the rendered file on that host carries the real value -- with
  `.Facts.agent_id` in the path, so it also proves where the render
  happened. `TestE2E_AgentSecretDenied` applies a reference to an
  ungranted path and asserts the run fails AND no file is written: a
  config file containing a blank password is the outcome the whole
  design exists to prevent, and it is worth asserting rather than
  assuming.

  The scaffold also exposes agent logs (`agentLogReader`). An agent
  that failed to start was previously invisible -- the output was
  captured and dropped, so a broken agent surfaced only as "agent-1 not
  yet connected" sixty seconds later.
