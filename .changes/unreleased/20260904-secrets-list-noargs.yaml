kind: Fixed
body: |-
  **`kscorectl secrets list` rejects a positional prefix instead of
  silently ignoring it.** The prefix comes from `--prefix`; the command's
  RunE discarded positionals and cobra's default accepted them, so
  `secrets list app` returned the entire listing while looking as though
  it had filtered to "app" -- a silently wrong answer. Now `cobra.NoArgs`.
  Found while building the secrets docs clip, whose tape command the
  promo tape-guard flagged as unresolvable.
