kind: Added
body: |-
  **A state file can reference a secret.** `{{ secret "app/db"
  "password" }}` resolves while the file is rendered on the agent, so
  the state file is safe to commit and the value exists only in the
  target file.

  This completes the arc that started with remote state apply: the
  agent keeps the identity the control plane issued it, proves which
  agent it is with that certificate, and receives a reply sealed to the
  same key -- so the value is fetched once per use, authorized per
  agent, and unreadable by the rest of the fleet.

  Wired at boot on both sides. The server registers the handler only
  when `identity.enabled`: without a CA there is no way to tell which
  agent is asking, and answering anyway would hand a secret to whoever
  published the request. Grants are compiled at startup, so a malformed
  rule stops the server rather than silently denying every lookup at
  runtime. The agent builds its client lazily, because a first-boot
  agent has no credential until bootstrap delivers one -- constructing
  eagerly would disable secret rendering on exactly the run that
  enrolled the host.

  A reference that cannot be resolved fails the render with the reason:
  no credential yet, no SVID because the control plane runs without
  identity, or the path is not granted. Rendering an empty string would
  write a config file with a blank password and report success.

  `secret` is defined even on a renderer that cannot resolve one, so
  the failure names the real problem instead of reading like a typo.
