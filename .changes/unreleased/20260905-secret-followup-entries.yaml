kind: Docs
body: |-
  **Tracked the agent-secret follow-ups that were only named in
  passing.** Retiring the "Agent-side secret resolution" ROADMAP entry
  said its open follow-ups were "tracked separately". They were not --
  they existed only inside the retirement comment, with no entries and
  no `release-order.yaml` mirrors, so nothing would have surfaced them
  again.

  Two real entries now exist. **Per-agent NATS credentials with subject
  permissions** (gate-v1.0) records that every agent shares one NATS
  credential and can subscribe to any subject, and says plainly why
  that is not what makes secret delivery safe today: replies are sealed
  to the requesting agent's SVID key, so confidentiality does not
  depend on the transport. The two are defence in depth, not
  alternatives. **Agent secret grants are config-only** (v0.x) records
  that changing a grant needs a server restart, and why compiling at
  boot was the right first shape.

  Nonce tracking for replay needed no new entry -- the existing "Replay
  protection on agent commands" already covers it.
