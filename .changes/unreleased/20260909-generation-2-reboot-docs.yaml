kind: Docs
body: |-
  **Generation 2 reboot: decision and control documents (R00/R01).**
  Records the accepted decision to preserve the current implementation
  as Generation 1 and restart active development as Generation 2, with
  a narrow NATS-first command-and-control product leading to `v0.6.0`.
  Adds RFC 0001, the reboot execution plan, the architecture
  invariants, the Generation 2 testing requirements, the requirements
  traceability register, the future-capability catalog, the
  development-VM handoff, and `epics/20-generation-2-reboot.md`.

  Documentation and planning only: no code is deleted, no archive ref
  is created, and no tracker or forge setting is mutated. Those are
  R02 onward, each behind its own approval, branch, and pull request.
  Epics 00-19, `FEATURES.md`, `PROJECT-DETAILS.md`, and the frozen
  roadmap stay in place as Generation 1 evidence until the archive
  exists; they are research, not authorization to implement.

  The 24 `ARCH-*` invariants carry stable identifiers and each maps to
  planned executable evidence, so an architecture rule cannot survive
  as prose alone. Generation 1 capabilities beyond the accepted RFC
  start in `FUTURE-CAPABILITIES.md` as unversioned candidates with no
  leaf issue, and reach the roadmap only through the promotion gate.
