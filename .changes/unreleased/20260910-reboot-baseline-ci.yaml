kind: Changed
body: |-
  **Generation 2 baseline CI gate, and the end of issue automation (R06).**
  Adds `.forgejo/workflows/reboot-baseline.yml`: one job, markdown lint plus the
  DCO sign-off check, deliberately needing no Go toolchain so it keeps working
  after R08 removes the module.

  This exists to avoid a specific trap. A required status context whose workflow
  has been deleted is never reported, and a branch that requires it can never be
  merged again — recoverable only through an admin protection-maintenance
  window. So the baseline lands first, a pull request makes its context
  selectable, required checks move to it, and only then may R08 delete the old
  workflows.

  Removes `ci-full.yml`'s `deps-outdated` job, the only automation in the
  repository that wrote to the issue tracker. It maintained tracking issue #232
  on the nightly cron, and it had to stop before R07: retirement fails closed
  when an allowlisted issue's `updated_at` has moved since review, so a nightly
  writer meant the reviewed snapshot decayed every morning at 05:00 UTC. Issue
  automation returns in R09, generation-aware and with a negative test.

  `ci-fast.yml` keeps running until R08. Between now and then its results are
  visible but no longer blocking — a deliberate trade, recorded in the manifest
  along with the twelve required contexts it replaces.
