kind: Added
body: |-
  **An agent can ask the control plane for a secret, and the control
  plane decides whether to answer.** `agent.SecretClient` signs a
  lookup with its SVID and waits for a sealed reply;
  `controlplane.SecretRequestHandler` authenticates, authorizes, reads
  and seals -- in that order, which is the design rather than an
  implementation detail.

  Authorization is `secrets.agent_grants`: rules matching agents by id
  or by label, allowing secret-path prefixes. Grants live in server
  config because an agent that declares its own entitlements is
  granting itself. Labels are read from the control plane's own agent
  record, never from the request, for the same reason -- and a verified
  certificate with no agent record fails closed rather than evaluating
  label rules against no labels.

  Deny by default, with no permissive setting. A rule naming neither
  `agent_ids` nor `labels` is rejected rather than read as "match
  everything", and a path of `*` or `/` is rejected outright: a rule
  that looks narrow while granting the entire store is the shape worth
  refusing at parse time. Path prefixes need an explicit trailing slash
  to cover a subtree, so `app` cannot silently grant `application/...`.

  No caching on the agent. A cached secret outlives the authorization
  that produced it, so every use asks again. Denials say only that the
  path is not granted -- not whether it exists, nor what would have
  been granted -- and a broker failure is reported as an error rather
  than a denial, without the backend's own message, which can name
  internal infrastructure.
