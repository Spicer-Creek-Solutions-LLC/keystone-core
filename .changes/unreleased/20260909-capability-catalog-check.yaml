kind: Added
body: |-
  **`make capability-catalog-check`.** Validates the R03 capability catalog
  against `docs/transition/capability-coverage.json` and the Generation 1
  sources as they stood at the archive target, catching a later hand edit, a
  source document gaining a heading, or a mistaken merge before it weakens the
  record R05 and R09 build on.

  It deliberately checks rather than regenerates. R03's generator ran once and
  needed four rounds of correction; preserving it as authoritative tooling would
  overstate how much it should be trusted. What has ongoing value is proving the
  claims still hold.

  The sources are read at the pinned commit rather than from the working tree,
  so transition tasks adding their own documents and changelog fragments cannot
  break a check about Generation 1. CI's docs job therefore checks out with
  `fetch-depth: 0`, the same reason `dco-check` does.
