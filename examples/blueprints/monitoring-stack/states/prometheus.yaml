# Prometheus Installation and Configuration
# Part of the Monitoring Stack Blueprint

metadata:
  name: monitoring-prometheus
  description: Prometheus server installation and configuration
  version: "1.0"

vars:
  prometheus_archive: "prometheus-{{ .Params.prometheus_version }}.linux-amd64"
  prometheus_url: "https://github.com/prometheus/prometheus/releases/download/v{{ .Params.prometheus_version }}/prometheus-{{ .Params.prometheus_version }}.linux-amd64.tar.gz"

states:
  # Download Prometheus
  prometheus_download:
    module: cmd
    state: run
    name: "curl -L -o /tmp/{{ .Vars.prometheus_archive }}.tar.gz {{ .Vars.prometheus_url }}"
    creates: /tmp/{{ .Vars.prometheus_archive }}.tar.gz
    unless: "test -f /usr/local/bin/prometheus && /usr/local/bin/prometheus --version 2>&1 | grep -q {{ .Params.prometheus_version }}"
    require:
      - install_curl
      - install_tar

  # Extract Prometheus
  prometheus_extract:
    module: cmd
    state: run
    name: |
      cd /tmp && \
      tar xzf {{ .Vars.prometheus_archive }}.tar.gz && \
      cp {{ .Vars.prometheus_archive }}/prometheus /usr/local/bin/ && \
      cp {{ .Vars.prometheus_archive }}/promtool /usr/local/bin/ && \
      chmod +x /usr/local/bin/prometheus /usr/local/bin/promtool && \
      rm -rf /tmp/{{ .Vars.prometheus_archive }}*
    unless: "test -f /usr/local/bin/prometheus && /usr/local/bin/prometheus --version 2>&1 | grep -q {{ .Params.prometheus_version }}"
    require:
      - prometheus_download

  # Create Prometheus data directory
  prometheus_data_dir:
    module: file
    state: directory
    name: "{{ .Params.prometheus_storage_path }}"
    user: prometheus
    group: prometheus
    mode: "0755"
    makedirs: true
    require:
      - monitoring_user

  # Create Prometheus config directory
  prometheus_config_dir:
    module: file
    state: directory
    name: "{{ .Params.config_dir }}/prometheus"
    user: root
    group: prometheus
    mode: "0755"
    require:
      - monitoring_config_dir

  # Create rules directory
  prometheus_rules_dir:
    module: file
    state: directory
    name: "{{ .Params.config_dir }}/prometheus/rules"
    user: root
    group: prometheus
    mode: "0755"
    require:
      - prometheus_config_dir

  # Create targets directory
  prometheus_targets_dir:
    module: file
    state: directory
    name: "{{ .Params.config_dir }}/prometheus/targets"
    user: root
    group: prometheus
    mode: "0755"
    require:
      - prometheus_config_dir

  # Deploy Prometheus configuration
  prometheus_config:
    module: file
    state: present
    name: "{{ .Params.config_dir }}/prometheus/prometheus.yml"
    contents: |
      # Keystone Core Monitoring Stack - Prometheus Configuration

      global:
        scrape_interval: {{ .Params.prometheus_scrape_interval }}
        evaluation_interval: {{ .Params.prometheus_scrape_interval }}
        external_labels:
          monitor: 'kscore-monitoring'

      {{ if .Features.alertmanager }}
      # Alertmanager configuration
      alerting:
        alertmanagers:
          - static_configs:
              - targets:
                - localhost:{{ .Params.alertmanager_port }}
      {{ end }}

      # Load rules once and periodically evaluate them
      rule_files:
        - {{ .Params.config_dir }}/prometheus/rules/*.rules.yml

      # Scrape configurations
      scrape_configs:
        # Prometheus self-monitoring
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:{{ .Params.prometheus_port }}']
          relabel_configs:
            - target_label: instance
              replacement: 'prometheus'

        {{ if .Features.node_exporter }}
        # Node Exporter - local system metrics
        - job_name: 'node'
          static_configs:
            - targets: ['localhost:{{ .Params.node_exporter_port }}']
          relabel_configs:
            - target_label: instance
              replacement: 'localhost'
        {{ end }}

        # File-based service discovery for dynamic targets
        - job_name: 'kscore-agents'
          file_sd_configs:
            - files:
                - {{ .Params.config_dir }}/prometheus/targets/*.yml
                - {{ .Params.config_dir }}/prometheus/targets/*.json
              refresh_interval: 30s

        # Keystone Core server metrics (if available)
        - job_name: 'kscore-server'
          static_configs:
            - targets: []  # Add kscore-server targets here
          metrics_path: /metrics
          scheme: http
    user: root
    group: prometheus
    mode: "0640"
    require:
      - prometheus_config_dir

  # Deploy systemd service
  prometheus_service_file:
    module: file
    state: present
    name: /etc/systemd/system/prometheus.service
    contents: |
      [Unit]
      Description=Prometheus Monitoring System
      Documentation=https://prometheus.io/docs/introduction/overview/
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=simple
      User=prometheus
      Group=prometheus
      ExecReload=/bin/kill -HUP $MAINPID
      ExecStart=/usr/local/bin/prometheus \
        --config.file={{ .Params.config_dir }}/prometheus/prometheus.yml \
        --storage.tsdb.path={{ .Params.prometheus_storage_path }} \
        --storage.tsdb.retention.time={{ .Params.prometheus_retention }} \
        --web.console.templates=/usr/local/bin/consoles \
        --web.console.libraries=/usr/local/bin/console_libraries \
        --web.listen-address=0.0.0.0:{{ .Params.prometheus_port }} \
        --web.enable-lifecycle \
        --web.enable-admin-api

      SyslogIdentifier=prometheus
      Restart=always
      RestartSec=5

      # Security settings
      NoNewPrivileges=yes
      ProtectSystem=full
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

  # Reload systemd
  prometheus_systemd_reload:
    module: cmd
    state: run
    name: systemctl daemon-reload
    require:
      - prometheus_service_file

  # Start and enable Prometheus
  prometheus_service:
    module: service
    state: running
    name: prometheus
    enable: true
    watch:
      - prometheus_config
      - prometheus_service_file
    require:
      - prometheus_extract
      - prometheus_data_dir
      - prometheus_systemd_reload
