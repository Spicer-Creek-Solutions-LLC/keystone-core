# Alertmanager Installation and Configuration
# Part of the Monitoring Stack Blueprint

{% set alertmanager_archive = "alertmanager-" ~ parameters.alertmanager_version ~ ".linux-amd64" %}
{% set alertmanager_url = "https://github.com/prometheus/alertmanager/releases/download/v" ~ parameters.alertmanager_version ~ "/" ~ alertmanager_archive ~ ".tar.gz" %}

# Download Alertmanager
alertmanager_download:
  file.managed:
    - name: /tmp/{{ alertmanager_archive }}.tar.gz
    - source: {{ alertmanager_url }}
    - skip_verify: true
    - unless: test -f /usr/local/bin/alertmanager && /usr/local/bin/alertmanager --version 2>&1 | grep -q {{ parameters.alertmanager_version }}
    - require:
      - pkg: monitoring_dependencies

# Extract Alertmanager
alertmanager_extract:
  cmd.run:
    - name: |
        cd /tmp && \
        tar xzf {{ alertmanager_archive }}.tar.gz && \
        cp {{ alertmanager_archive }}/alertmanager /usr/local/bin/ && \
        cp {{ alertmanager_archive }}/amtool /usr/local/bin/ && \
        chmod +x /usr/local/bin/alertmanager /usr/local/bin/amtool && \
        rm -rf /tmp/{{ alertmanager_archive }}*
    - unless: test -f /usr/local/bin/alertmanager && /usr/local/bin/alertmanager --version 2>&1 | grep -q {{ parameters.alertmanager_version }}
    - require:
      - file: alertmanager_download

# Create Alertmanager data directory
alertmanager_data_dir:
  file.directory:
    - name: {{ parameters.data_dir }}/alertmanager
    - user: prometheus
    - group: prometheus
    - mode: 755
    - require:
      - user: monitoring_user
      - file: monitoring_data_dir

# Create Alertmanager config directory
alertmanager_config_dir:
  file.directory:
    - name: {{ parameters.config_dir }}/alertmanager
    - user: root
    - group: prometheus
    - mode: 755
    - require:
      - file: monitoring_config_dir

# Create templates directory
alertmanager_templates_dir:
  file.directory:
    - name: {{ parameters.config_dir }}/alertmanager/templates
    - user: root
    - group: prometheus
    - mode: 755
    - require:
      - file: alertmanager_config_dir

# Deploy Alertmanager configuration
alertmanager_config:
  file.managed:
    - name: {{ parameters.config_dir }}/alertmanager/alertmanager.yml
    - source: template://templates/alertmanager.yml.j2
    - template: jinja
    - context:
        alertmanager_port: {{ parameters.alertmanager_port }}
    - user: root
    - group: prometheus
    - mode: 640
    - require:
      - file: alertmanager_config_dir

# Deploy systemd service
alertmanager_service_file:
  file.managed:
    - name: /etc/systemd/system/alertmanager.service
    - source: template://templates/alertmanager.service.j2
    - template: jinja
    - context:
        alertmanager_port: {{ parameters.alertmanager_port }}
        data_dir: "{{ parameters.data_dir }}"
        config_dir: "{{ parameters.config_dir }}"
    - mode: 644

# Reload systemd
alertmanager_systemd_reload:
  cmd.run:
    - name: systemctl daemon-reload
    - onchanges:
      - file: alertmanager_service_file

# Start and enable Alertmanager
alertmanager_service:
  service.running:
    - name: alertmanager
    - enable: true
    - watch:
      - file: alertmanager_config
      - file: alertmanager_service_file
    - require:
      - cmd: alertmanager_extract
      - file: alertmanager_data_dir
      - cmd: alertmanager_systemd_reload
