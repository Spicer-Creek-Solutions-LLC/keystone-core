# Security Baseline Main State File
# Entry point for security hardening

metadata:
  name: security-main
  description: Security baseline entry point with conditional components
  version: "1.0"

# All components are conditionally included based on features
include_if:
  - path: states/system.yaml
    condition: "{{ .Features.system_hardening }}"
  - path: states/ssh.yaml
    condition: "{{ .Features.ssh_hardening }}"
  - path: states/kernel.yaml
    condition: "{{ .Features.kernel_hardening }}"
  - path: states/firewall.yaml
    condition: "{{ .Features.firewall }}"
  - path: states/audit.yaml
    condition: "{{ .Features.audit_logging }}"
  - path: states/fail2ban.yaml
    condition: "{{ .Features.fail2ban }}"
  - path: states/updates.yaml
    condition: "{{ .Features.automatic_updates }}"
