# SSH Hardening Configuration
# Part of the Security Baseline Blueprint

# Ensure OpenSSH is installed
ssh_server_package:
  pkg.installed:
    - name: openssh-server

# Backup original sshd_config
ssh_config_backup:
  cmd.run:
    - name: cp -n /etc/ssh/sshd_config /etc/ssh/sshd_config.orig
    - creates: /etc/ssh/sshd_config.orig
    - require:
      - pkg: ssh_server_package

# Deploy hardened sshd_config
ssh_config:
  file.managed:
    - name: /etc/ssh/sshd_config
    - source: template://templates/sshd_config.j2
    - template: jinja
    - context:
        port: {{ parameters.ssh_port }}
        permit_root_login: "{{ parameters.ssh_permit_root_login }}"
        password_authentication: "{{ parameters.ssh_password_authentication }}"
        max_auth_tries: {{ parameters.ssh_max_auth_tries }}
        client_alive_interval: {{ parameters.ssh_client_alive_interval }}
        client_alive_count_max: {{ parameters.ssh_client_alive_count_max }}
        allowed_users: {{ parameters.ssh_allowed_users | tojson }}
        allowed_groups: {{ parameters.ssh_allowed_groups | tojson }}
    - user: root
    - group: root
    - mode: 600
    - require:
      - cmd: ssh_config_backup

# Deploy SSH banner
ssh_banner:
  file.managed:
    - name: /etc/ssh/banner
    - source: file://files/banner.txt
    - user: root
    - group: root
    - mode: 644

# Ensure SSH host keys have correct permissions
{% for keytype in ['rsa', 'ecdsa', 'ed25519'] %}
ssh_host_{{ keytype }}_key_perms:
  file.managed:
    - name: /etc/ssh/ssh_host_{{ keytype }}_key
    - mode: 600
    - replace: false
    - require:
      - pkg: ssh_server_package
{% endfor %}

# Validate SSH config before restart
ssh_config_validate:
  cmd.run:
    - name: sshd -t
    - onchanges:
      - file: ssh_config

# Restart SSH service
ssh_service:
  service.running:
    - name: sshd
    - enable: true
    - watch:
      - file: ssh_config
    - require:
      - cmd: ssh_config_validate
