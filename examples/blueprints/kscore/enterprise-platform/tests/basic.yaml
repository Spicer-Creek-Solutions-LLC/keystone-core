name: enterprise platform blueprint

defaults:
  dry_run: true
  parameters:
    cluster_name: keystone-ent
    node_role: control-plane
    control_plane_nodes:
      - cp1.example.com
      - cp2.example.com
      - cp3.example.com
    regions:
      - us-east
      - eu-west
    postgres_host: db.example.com
    postgres_password: demo-pass

tests:
  - name: renders enterprise config
    assertions:
      - type: state_applied
        target: enterprise_config_file
      - type: file_contains
        target: /etc/keystone-core/keystone-core.yaml
        pattern: "cluster:\n        name: \"keystone-ent\""
