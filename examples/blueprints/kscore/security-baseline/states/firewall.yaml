# Firewall Configuration
# Part of the Security Baseline Blueprint

metadata:
  name: security-firewall
  description: Host-based firewall configuration (UFW for Debian, firewalld for RHEL)
  version: "1.0"

states:
  ###################
  # UFW for Debian/Ubuntu
  ###################

  # Install UFW
  ufw_package:
    module: package
    state: installed
    name: ufw
    only_if: '{{ eq .os_family "debian" }}'

  # Set default incoming policy
  ufw_default_incoming:
    module: cmd
    state: run
    name: "ufw default {{ .firewall_default_policy }} incoming"
    unless: "ufw status verbose | grep -q 'Default: {{ .firewall_default_policy }} (incoming)'"
    only_if: '{{ eq .os_family "debian" }}'
    require:
      - ufw_package

  # Set default outgoing policy (allow)
  ufw_default_outgoing:
    module: cmd
    state: run
    name: "ufw default allow outgoing"
    unless: "ufw status verbose | grep -q 'Default: allow (outgoing)'"
    only_if: '{{ eq .os_family "debian" }}'
    require:
      - ufw_package

  # Allow SSH (always needed)
  ufw_allow_ssh:
    module: cmd
    state: run
    name: "ufw allow {{ .ssh_port }}/tcp"
    unless: "ufw status | grep -qE '^{{ .ssh_port }}/tcp'"
    only_if: '{{ eq .os_family "debian" }}'
    require:
      - ufw_default_incoming

  # Enable UFW
  ufw_enable:
    module: cmd
    state: run
    name: "ufw --force enable"
    unless: "ufw status | grep -q 'Status: active'"
    only_if: '{{ eq .os_family "debian" }}'
    require:
      - ufw_default_incoming
      - ufw_default_outgoing
      - ufw_allow_ssh

  ###################
  # Firewalld for RHEL/CentOS
  ###################

  # Install firewalld
  firewalld_package:
    module: package
    state: installed
    name: firewalld
    only_if: '{{ eq .os_family "rhel" }}'

  # Start firewalld service
  firewalld_service:
    module: service
    state: running
    name: firewalld
    enable: true
    only_if: '{{ eq .os_family "rhel" }}'
    require:
      - firewalld_package

  # Set default zone based on policy (deny = drop zone)
  firewalld_default_zone_deny:
    module: cmd
    state: run
    name: firewall-cmd --set-default-zone=drop
    unless: firewall-cmd --get-default-zone | grep -q drop
    only_if: '{{ and (eq .os_family "rhel") (eq .firewall_default_policy "deny") }}'
    require:
      - firewalld_service

  # Set default zone based on policy (allow = public zone)
  firewalld_default_zone_allow:
    module: cmd
    state: run
    name: firewall-cmd --set-default-zone=public
    unless: firewall-cmd --get-default-zone | grep -q public
    only_if: '{{ and (eq .os_family "rhel") (ne .firewall_default_policy "deny") }}'
    require:
      - firewalld_service

  # Allow SSH port (always needed)
  firewalld_allow_ssh:
    module: cmd
    state: run
    name: firewall-cmd --permanent --add-port={{ .ssh_port }}/tcp && firewall-cmd --reload
    unless: firewall-cmd --list-ports | grep -q "{{ .ssh_port }}/tcp"
    only_if: '{{ eq .os_family "rhel" }}'
    require:
      - firewalld_service
