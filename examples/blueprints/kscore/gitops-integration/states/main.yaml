metadata:
  name: gitops-integration-main
  description: GitOps integration configuration
  version: "0.1"

states:
  gitops_config_dir:
    module: file
    state: directory
    name: /etc/keystone-core

  gitops_config_file:
    module: file
    state: managed
    name: /etc/keystone-core/gitops.yaml
    contents: |
      gitops:
        argocd_enabled: {{ .argocd_enabled }}
        flux_enabled: {{ .flux_enabled }}
        verification_enabled: {{ .verification_enabled }}
        rollback_enabled: {{ .rollback_enabled }}
        repositories:
{{- range .git_repos }}
          - "{{ . }}"
{{- end }}
    require:
      - gitops_config_dir

  gitops_service:
    module: service
    state: running
    name: kscore-server
    enable: true
    watch:
      - gitops_config_file
