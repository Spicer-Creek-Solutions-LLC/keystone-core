name: gitops integration blueprint

defaults:
  dry_run: true
  parameters:
    argocd_enabled: true
    flux_enabled: false
    git_repos:
      - https://example.com/keystone.git

tests:
  - name: writes gitops config
    assertions:
      - type: state_applied
        target: gitops_config_file
      - type: file_contains
        target: /etc/kscore/gitops.yaml
        pattern: "argocd_enabled: true"
