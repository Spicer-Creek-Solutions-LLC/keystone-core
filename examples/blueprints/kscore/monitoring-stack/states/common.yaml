# Common Setup for Monitoring Stack
# Creates users, directories, and installs dependencies

metadata:
  name: monitoring-common
  description: Common setup for monitoring stack - users, directories, dependencies
  version: "1.0"

states:
  # Create monitoring group
  monitoring_group:
    module: group
    state: present
    name: prometheus
    system: true

  # Create monitoring user
  monitoring_user:
    module: user
    state: present
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    home: "{{ .Params.data_dir }}"
    createhome: false
    require:
      - monitoring_group

  # Create base directories
  monitoring_data_dir:
    module: file
    state: directory
    name: "{{ .Params.data_dir }}"
    user: prometheus
    group: prometheus
    mode: "0755"
    makedirs: true
    require:
      - monitoring_user

  monitoring_config_dir:
    module: file
    state: directory
    name: "{{ .Params.config_dir }}"
    user: root
    group: prometheus
    mode: "0755"
    makedirs: true
    require:
      - monitoring_group

  # Install common dependencies - curl
  install_curl:
    module: package
    state: installed
    name: curl

  # Install common dependencies - tar
  install_tar:
    module: package
    state: installed
    name: tar

  # Install common dependencies - gzip
  install_gzip:
    module: package
    state: installed
    name: gzip

  # Install ca-certificates (Debian only)
  install_ca_certificates:
    module: package
    state: installed
    name: ca-certificates
    only_if: "{{ eq .Params.os_family \"debian\" }}"
