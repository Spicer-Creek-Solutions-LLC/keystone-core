# Monitoring Stack Main State File
# Entry point that includes all monitoring components

metadata:
  name: monitoring-main
  description: Entry point for monitoring stack with conditional components
  version: "1.0"

# Include component states in order
# Core components are always included
# Optional components are conditionally included based on features
include:
  - states/common.yaml
  - states/prometheus.yaml
  - states/node_exporter.yaml

# Conditional includes based on feature flags
include_if:
  - path: states/alertmanager.yaml
    condition: "{{ .Features.alertmanager }}"
  - path: states/grafana.yaml
    condition: "{{ .Features.grafana }}"
  - path: states/blackbox_exporter.yaml
    condition: "{{ .Features.blackbox_exporter }}"
