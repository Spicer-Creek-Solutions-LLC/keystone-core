apiVersion: blueprints.keystone-core.io/v1
kind: Blueprint
metadata:
  name: production-cluster
  version: 0.1.0
  description: Production-ready HA cluster blueprint for Keystone Core.
  maintainers:
    - name: Keystone Core Team
      email: team@keystone-core.io
  license: Apache-2.0
  keywords:
    - production
    - ha
    - cluster
  categories:
    - core
    - production

compatibility:
  platforms:
    - os: linux

entrypoints:
  default: states/core.yaml

features:
  nats_cluster:
    default: true
    description: Provision a managed NATS cluster
    enables:
      - states/nats.yaml

  postgres_ha:
    default: true
    description: Provision PostgreSQL HA resources
    enables:
      - states/postgres.yaml

  monitoring:
    default: false
    description: Deploy the monitoring stack
    enables:
      - states/monitoring.yaml

  security:
    default: false
    description: Apply security baseline hardening
    enables:
      - states/security.yaml

  gitops:
    default: false
    description: Configure GitOps integrations
    enables:
      - states/gitops.yaml

parameters:
  cluster_name:
    type: string
    default: keystone
    description: Cluster identifier

  node_role:
    type: string
    default: control-plane
    enum:
      - control-plane
      - agent
      - both
    description: Node role for this host

  control_plane_nodes:
    type: array
    required: true
    description: Control plane node addresses

  nats_mode:
    type: string
    default: embedded-cluster
    enum:
      - embedded-cluster
      - external
    description: NATS deployment mode

  nats_urls:
    type: array
    default: []
    description: External NATS URLs (if external)

  postgres_host:
    type: string
    required: true
    description: PostgreSQL host

  postgres_replicas:
    type: array
    default: []
    description: PostgreSQL replica hosts

  postgres_port:
    type: integer
    default: 5432
    description: PostgreSQL port

  postgres_database:
    type: string
    default: keystone
    description: PostgreSQL database name

  postgres_user:
    type: string
    default: keystone
    description: PostgreSQL user

  postgres_password:
    type: string
    sensitive: true
    required: true
    description: PostgreSQL password

  tls_mode:
    type: string
    default: generate
    enum:
      - generate
      - provided
      - letsencrypt
    description: TLS certificate mode

  tls_cert:
    type: string
    description: TLS certificate path (provided mode)

  tls_key:
    type: string
    description: TLS key path (provided mode)

  ca_cert:
    type: string
    description: CA certificate path (provided mode)

  backup_enabled:
    type: boolean
    default: true
    description: Enable automated backups

  backup_destination:
    type: string
    default: local
    description: Backup destination
