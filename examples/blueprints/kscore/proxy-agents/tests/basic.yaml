name: proxy agents blueprint

defaults:
  dry_run: true
  parameters:
    credential_backend: file
    discovery_enabled: true
    discovery_subnets:
      - 10.0.0.0/24

tests:
  - name: writes proxy config
    assertions:
      - type: state_applied
        target: proxy_agents_config_file
      - type: file_contains
        target: /etc/kscore/proxy-agents.yaml
        pattern: "credential_backend: \"file\""
