metadata:
  name: proxy-agents-main
  description: Proxy agent configuration for unmanaged devices
  version: "0.1"

states:
  proxy_agents_config_dir:
    module: file
    state: directory
    name: /etc/kscore

  proxy_agents_config_file:
    module: file
    state: managed
    name: /etc/kscore/proxy-agents.yaml
    contents: |
      proxy_agents:
        credential_backend: "{{ .credential_backend }}"
        vault_address: "{{ .vault_address }}"
        discovery_enabled: {{ .discovery_enabled }}
        discovery_subnets:
{{- range .discovery_subnets }}
          - "{{ . }}"
{{- end }}
    require:
      - proxy_agents_config_dir

  proxy_agents_service:
    module: service
    state: running
    name: kscore-server
    enable: true
    watch:
      - proxy_agents_config_file
