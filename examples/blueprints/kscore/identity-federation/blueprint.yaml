apiVersion: blueprints.keystone-core.io/v1
kind: Blueprint
metadata:
  name: identity-federation
  version: 0.1.0
  description: Identity federation blueprint for Keystone Core trust domains.
  maintainers:
    - name: Spicer Creek Solutions LLC
      email: team@keystone-core.io
  license: Apache-2.0
  keywords:
    - identity
    - spiffe
    - federation
  categories:
    - security
    - identity

compatibility:
  platforms:
    - os: linux

entrypoints:
  default: states/main.yaml

parameters:
  local_domain:
    type: string
    required: true
    description: Local trust domain

  federated_domains:
    type: array
    default: []
    description: Domains to federate with

  federation_policy:
    type: string
    default: verify
    enum:
      - trust
      - verify
      - strict
    description: Federation policy
