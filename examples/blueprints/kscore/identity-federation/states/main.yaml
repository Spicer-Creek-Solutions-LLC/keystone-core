metadata:
  name: identity-federation-main
  description: Identity federation configuration for Keystone Core
  version: "0.1"

states:
  identity_federation_config_dir:
    module: file
    state: directory
    name: /etc/keystone-core

  identity_federation_config:
    module: file
    state: managed
    name: /etc/keystone-core/identity-federation.yaml
    contents: |
      identity:
        local_domain: "{{ .local_domain }}"
        federated_domains:
{{- range .federated_domains }}
          - "{{ . }}"
{{- end }}
        federation_policy: "{{ .federation_policy }}"
    require:
      - identity_federation_config_dir

  identity_federation_service:
    module: service
    state: running
    name: kscore-server
    enable: true
    watch:
      - identity_federation_config
