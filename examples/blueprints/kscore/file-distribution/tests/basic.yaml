name: file distribution blueprint

defaults:
  dry_run: true
  parameters:
    backends:
      - local
    s3_bucket: keystone-artifacts
    s3_region: us-east-1

tests:
  - name: writes file distribution config
    assertions:
      - type: state_applied
        target: file_distribution_config_file
      - type: file_contains
        target: /etc/kscore/file-distribution.yaml
        pattern: "s3_bucket: \"keystone-artifacts\""
