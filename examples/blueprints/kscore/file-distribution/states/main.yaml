metadata:
  name: file-distribution-main
  description: File distribution configuration for Keystone Core
  version: "0.1"

states:
  file_distribution_config_dir:
    module: file
    state: directory
    name: /etc/kscore

  file_distribution_config_file:
    module: file
    state: managed
    name: /etc/kscore/file-distribution.yaml
    contents: |
      file_distribution:
        backends:
{{- range .backends }}
          - "{{ . }}"
{{- end }}
        s3_bucket: "{{ .s3_bucket }}"
        s3_region: "{{ .s3_region }}"
        gcs_bucket: "{{ .gcs_bucket }}"
        azure_container: "{{ .azure_container }}"
        mirror_groups:
{{- range .mirror_groups }}
          - {{ . | toYaml | nindent 12 }}
{{- end }}
    require:
      - file_distribution_config_dir

  file_distribution_service:
    module: service
    state: running
    name: kscore-server
    enable: true
    watch:
      - file_distribution_config_file
