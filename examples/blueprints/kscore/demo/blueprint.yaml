apiVersion: blueprints.kscore.io/v1
kind: Blueprint
metadata:
  name: demo
  version: 0.1.0
  description: Demo blueprint for a single-node Keystone Core environment.
  maintainers:
    - name: Keystone Core Team
      email: team@kscore.io
  license: Apache-2.0
  keywords:
    - demo
    - lab
    - bootstrap
  categories:
    - core
    - demo

compatibility:
  platforms:
    - os: linux

entrypoints:
  default: states/main.yaml

parameters:
  hostname:
    type: string
    default: localhost
    description: Hostname for the instance

  admin_password:
    type: string
    sensitive: true
    description: Admin API password

  enable_examples:
    type: boolean
    default: true
    description: Deploy example states and agents

  enable_dashboards:
    type: boolean
    default: true
    description: Deploy Grafana dashboards
