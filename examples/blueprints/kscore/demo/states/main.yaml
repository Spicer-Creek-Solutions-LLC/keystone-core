metadata:
  name: demo-main
  description: Placeholder state for the demo blueprint scaffold
  version: "0.1"

states:
  demo_blueprint_dir:
    module: file
    state: directory
    name: /var/lib/kscore/blueprints

  demo_blueprint_placeholder:
    module: file
    state: managed
    name: /var/lib/kscore/blueprints/demo.txt
    contents: "Placeholder for kscore/demo blueprint."
    require:
      - demo_blueprint_dir
