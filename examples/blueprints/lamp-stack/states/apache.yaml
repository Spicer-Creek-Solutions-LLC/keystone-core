# Apache Web Server Configuration
# Part of the LAMP Stack Blueprint

metadata:
  name: lamp-apache
  description: Apache web server installation and configuration
  version: "1.0"

# Platform-specific package names are set in vars
vars:
  # Debian/Ubuntu defaults (overridden by parameters)
  apache_pkg: "{{ if eq .Params.os_family \"rhel\" }}httpd{{ else }}apache2{{ end }}"
  apache_svc: "{{ if eq .Params.os_family \"rhel\" }}httpd{{ else }}apache2{{ end }}"
  apache_conf_dir: "{{ if eq .Params.os_family \"rhel\" }}/etc/httpd{{ else }}/etc/apache2{{ end }}"
  apache_user: "{{ if eq .Params.os_family \"rhel\" }}apache{{ else }}www-data{{ end }}"
  apache_group: "{{ if eq .Params.os_family \"rhel\" }}apache{{ else }}www-data{{ end }}"
  php_mod_pkg: "{{ if eq .Params.os_family \"rhel\" }}php{{ else }}libapache2-mod-php{{ .Params.php_version }}{{ end }}"

states:
  # Install Apache web server
  install_apache:
    module: package
    state: installed
    name: "{{ .Vars.apache_pkg }}"

  # Install PHP Apache module
  install_php_module:
    module: package
    state: installed
    name: "{{ .Vars.php_mod_pkg }}"
    require:
      - install_apache

  # Create document root directory
  create_document_root:
    module: file
    state: directory
    name: "{{ .Params.document_root }}"
    user: "{{ .Vars.apache_user }}"
    group: "{{ .Vars.apache_group }}"
    mode: "0755"
    makedirs: true
    require:
      - install_apache

  # Enable Apache modules (Debian only)
  enable_rewrite_module:
    module: cmd
    state: run
    name: a2enmod rewrite
    creates: /etc/apache2/mods-enabled/rewrite.load
    only_if: "{{ eq .Params.os_family \"debian\" }}"
    require:
      - install_apache

  enable_headers_module:
    module: cmd
    state: run
    name: a2enmod headers
    creates: /etc/apache2/mods-enabled/headers.load
    only_if: "{{ eq .Params.os_family \"debian\" }}"
    require:
      - install_apache

  enable_ssl_module:
    module: cmd
    state: run
    name: a2enmod ssl
    creates: /etc/apache2/mods-enabled/ssl.load
    only_if: "{{ eq .Params.os_family \"debian\" }}"
    require:
      - install_apache

  # Apache main configuration
  configure_apache:
    module: file
    state: present
    name: "{{ .Vars.apache_conf_dir }}/{{ if eq .Params.os_family \"rhel\" }}conf/httpd.conf{{ else }}apache2.conf{{ end }}"
    contents: |
      # Apache configuration managed by Keystone Core
      ServerName {{ .Params.server_name }}
      ServerAdmin {{ .Params.server_admin }}
      DocumentRoot {{ .Params.document_root }}

      Listen {{ .Params.http_port }}

      <Directory {{ .Params.document_root }}>
          Options Indexes FollowSymLinks
          AllowOverride All
          Require all granted
      </Directory>

      # Security settings
      ServerTokens Prod
      ServerSignature Off
      TraceEnable Off

      # Include module configurations
      IncludeOptional {{ .Vars.apache_conf_dir }}/conf-enabled/*.conf
      IncludeOptional {{ .Vars.apache_conf_dir }}/sites-enabled/*.conf
    user: root
    group: root
    mode: "0644"
    require:
      - install_apache

  # Virtual host configuration (Debian)
  configure_vhost_debian:
    module: file
    state: present
    name: /etc/apache2/sites-available/000-default.conf
    contents: |
      <VirtualHost *:{{ .Params.http_port }}>
          ServerName {{ .Params.server_name }}
          ServerAdmin {{ .Params.server_admin }}
          DocumentRoot {{ .Params.document_root }}

          <Directory {{ .Params.document_root }}>
              Options Indexes FollowSymLinks
              AllowOverride All
              Require all granted
          </Directory>

          ErrorLog ${APACHE_LOG_DIR}/error.log
          CustomLog ${APACHE_LOG_DIR}/access.log combined
      </VirtualHost>
    user: root
    group: root
    mode: "0644"
    only_if: "{{ eq .Params.os_family \"debian\" }}"
    require:
      - install_apache

  # Virtual host configuration (RHEL)
  configure_vhost_rhel:
    module: file
    state: present
    name: /etc/httpd/conf.d/vhost.conf
    contents: |
      <VirtualHost *:{{ .Params.http_port }}>
          ServerName {{ .Params.server_name }}
          ServerAdmin {{ .Params.server_admin }}
          DocumentRoot {{ .Params.document_root }}

          <Directory {{ .Params.document_root }}>
              Options Indexes FollowSymLinks
              AllowOverride All
              Require all granted
          </Directory>

          ErrorLog logs/error_log
          CustomLog logs/access_log combined
      </VirtualHost>
    user: root
    group: root
    mode: "0644"
    only_if: "{{ eq .Params.os_family \"rhel\" }}"
    require:
      - install_apache

  # Enable default site (Debian)
  enable_default_site:
    module: cmd
    state: run
    name: a2ensite 000-default.conf
    creates: /etc/apache2/sites-enabled/000-default.conf
    only_if: "{{ eq .Params.os_family \"debian\" }}"
    require:
      - configure_vhost_debian

  # Start and enable Apache service
  apache_service:
    module: service
    state: running
    name: "{{ .Vars.apache_svc }}"
    enable: true
    watch:
      - configure_apache
      - configure_vhost_debian
      - configure_vhost_rhel
    require:
      - install_apache
      - install_php_module
      - create_document_root
