# MySQL/MariaDB Configuration
# Part of the LAMP Stack Blueprint

metadata:
  name: lamp-mysql
  description: MySQL/MariaDB installation and configuration
  version: "1.0"

# Platform-specific package names
vars:
  mysql_pkg: mariadb-server
  mysql_client_pkg: "{{ if eq .Params.os_family \"rhel\" }}mariadb{{ else }}mariadb-client{{ end }}"
  mysql_svc: mariadb
  mysql_conf_dir: "{{ if eq .Params.os_family \"rhel\" }}/etc/my.cnf.d{{ else }}/etc/mysql/mariadb.conf.d{{ end }}"

states:
  # Install MySQL/MariaDB server
  install_mysql_server:
    module: package
    state: installed
    name: "{{ .Vars.mysql_pkg }}"

  # Install MySQL client
  install_mysql_client:
    module: package
    state: installed
    name: "{{ .Vars.mysql_client_pkg }}"

  # MySQL configuration
  configure_mysql:
    module: file
    state: present
    name: "{{ .Vars.mysql_conf_dir }}/99-kscore.cnf"
    contents: |
      # MySQL/MariaDB Configuration managed by Keystone Core
      [mysqld]
      # Network
      bind-address = {{ .Params.mysql_bind_address }}

      # Connection limits
      max_connections = {{ .Params.mysql_max_connections }}

      # Character set
      character-set-server = utf8mb4
      collation-server = utf8mb4_unicode_ci

      # InnoDB settings
      innodb_buffer_pool_size = 256M
      innodb_log_file_size = 64M
      innodb_file_per_table = 1

      # Query cache (disabled in MariaDB 10.1.7+)
      query_cache_type = 0
      query_cache_size = 0

      # Logging
      log_error = /var/log/mysql/error.log
      slow_query_log = 1
      slow_query_log_file = /var/log/mysql/slow.log
      long_query_time = 2

      [client]
      default-character-set = utf8mb4
    user: root
    group: root
    mode: "0644"
    require:
      - install_mysql_server

  # Start MySQL service
  mysql_service:
    module: service
    state: running
    name: "{{ .Vars.mysql_svc }}"
    enable: true
    watch:
      - configure_mysql
    require:
      - install_mysql_server

  # Secure MySQL installation - set root password
  # Note: This command sets the root password if not already set
  secure_mysql_root:
    module: cmd
    state: run
    name: |
      mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ .Params.mysql_root_password }}';" 2>/dev/null || \
      mysql -u root -p'{{ .Params.mysql_root_password }}' -e "SELECT 1" 2>/dev/null
    unless: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "SELECT 1" 2>/dev/null
    require:
      - mysql_service

  # Remove anonymous users
  remove_anonymous_users:
    module: cmd
    state: run
    name: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "DELETE FROM mysql.user WHERE User='';"
    unless: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "SELECT User FROM mysql.user WHERE User=''" | grep -q ""
    require:
      - secure_mysql_root

  # Remove remote root login
  remove_remote_root:
    module: cmd
    state: run
    name: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1');"
    require:
      - secure_mysql_root

  # Remove test database
  remove_test_db:
    module: cmd
    state: run
    name: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "DROP DATABASE IF EXISTS test; DELETE FROM mysql.db WHERE Db='test' OR Db='test\\_%';"
    require:
      - secure_mysql_root

  # Flush privileges after security changes
  flush_privileges:
    module: cmd
    state: run
    name: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "FLUSH PRIVILEGES;"
    require:
      - remove_anonymous_users
      - remove_remote_root
      - remove_test_db

  # Create application database
  create_app_database:
    module: cmd
    state: run
    name: |
      mysql -u root -p'{{ .Params.mysql_root_password }}' -e "CREATE DATABASE IF NOT EXISTS {{ .Params.mysql_database }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    unless: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "USE {{ .Params.mysql_database }}" 2>/dev/null
    require:
      - flush_privileges

  # Create application user
  create_app_user:
    module: cmd
    state: run
    name: |
      mysql -u root -p'{{ .Params.mysql_root_password }}' -e "CREATE USER IF NOT EXISTS '{{ .Params.mysql_user }}'@'localhost' IDENTIFIED BY '{{ .Params.mysql_password }}';"
    unless: mysql -u root -p'{{ .Params.mysql_root_password }}' -e "SELECT User FROM mysql.user WHERE User='{{ .Params.mysql_user }}'" 2>/dev/null | grep -q "{{ .Params.mysql_user }}"
    require:
      - create_app_database

  # Grant privileges to application user
  grant_app_privileges:
    module: cmd
    state: run
    name: |
      mysql -u root -p'{{ .Params.mysql_root_password }}' -e "GRANT ALL PRIVILEGES ON {{ .Params.mysql_database }}.* TO '{{ .Params.mysql_user }}'@'localhost'; FLUSH PRIVILEGES;"
    require:
      - create_app_user

  # Install phpMyAdmin (if enabled)
  install_phpmyadmin:
    module: package
    state: installed
    name: phpmyadmin
    only_if: "{{ .Features.phpmyadmin }}"
    require:
      - install_mysql_server

  # Configure phpMyAdmin
  configure_phpmyadmin:
    module: file
    state: present
    name: /etc/phpmyadmin/config.inc.php
    contents: |
      <?php
      // phpMyAdmin configuration managed by Keystone Core

      $cfg['blowfish_secret'] = '{{ .Params.mysql_root_password | sha256sum | slice 0 32 }}';

      $i = 0;
      $i++;

      $cfg['Servers'][$i]['auth_type'] = 'cookie';
      $cfg['Servers'][$i]['host'] = 'localhost';
      $cfg['Servers'][$i]['compress'] = false;
      $cfg['Servers'][$i]['AllowNoPassword'] = false;

      $cfg['UploadDir'] = '';
      $cfg['SaveDir'] = '';
    user: root
    group: root
    mode: "0640"
    only_if: "{{ .Features.phpmyadmin }}"
    require:
      - install_phpmyadmin

  # Enable phpMyAdmin in Apache (Debian)
  enable_phpmyadmin_apache:
    module: file
    state: symlink
    name: /etc/apache2/conf-enabled/phpmyadmin.conf
    source: /etc/phpmyadmin/apache.conf
    only_if: "{{ and .Features.phpmyadmin (eq .Params.os_family \"debian\") }}"
    require:
      - configure_phpmyadmin
