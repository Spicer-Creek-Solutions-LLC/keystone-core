# Lychee configuration for link checking

verbose = "info"
no_progress = true
max_retries = 2
timeout = 20
include_mail = true
scheme = ["https", "http", "mailto"]

exclude = [
  "http://localhost",
  "http://localhost:1313",
  "https://localhost",
  "http://127.0.0.1",
  "http://0.0.0.0",
  "https://0.0.0.0",
  "http://example.com",
  "https://example.com",
  # Pre-launch placeholders. These domains are aspirational and will
  # be wired up (or replaced with real channels) during launch prep
  # per docs/project/PUBLIC-LAUNCH-CHECKLIST.md Phase B6 + F-phase.
  # Excluded so the CI link gate doesn't fail on absent infra.
  "@keystone-core.io",
  "@keystone.io",
  "docs.keystone.io",
  "keystone-community.slack.com",
  # Documented config-example hostnames that intentionally do not
  # resolve (operators substitute real internal endpoints).
  "vault.internal"
]

exclude_path = [
  "docs/themes",
  "docs/node_modules",
  "docs/resources",
  "docs/public",
  # Hugo content (the site's hand-authored pages) uses site-relative
  # links (/docs/..., ../page/) that resolve in the rendered site, not at
  # the source-file level. Those are link-checked by `make docs-links-site`
  # over docs/public/ instead; this source `.md` gate would false-positive.
  "docs/content"
]
