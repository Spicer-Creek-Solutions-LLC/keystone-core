[package]
name = "titan-module-sdk"
version = "0.1.0"
edition = "2021"
authors = ["TitanAnvil Contributors"]
description = "SDK for building TitanAnvil modules in Rust that compile to WebAssembly"
license = "MIT"
repository = "https://github.com/titananvil/titan-anvil"
keywords = ["titananvil", "wasm", "plugin", "module"]
categories = ["wasm", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASI dependencies for wasm32-wasi target
# These are only needed when compiling to WASM

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
