mode: development

server:
  host: 127.0.0.1
  grpcport: 9090
  httpport: 8080
  # Dev fixtures explicitly opt out of TLS so kscore-server boots
  # against API-key auth without needing a CA bootstrap. Production
  # configs inherit the new TLS=true default — see Epic 09 task 13.
  tls:
    enabled: false

logging:
  level: info
  format: json

storage:
  driver: sqlite
  dsn: ./data/keystone.db
