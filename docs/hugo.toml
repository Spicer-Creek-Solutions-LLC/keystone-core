baseURL = "https://docs.kscore.dev/"
title = "Keystone Core Documentation"
theme = "docsy"
publishDir = "../build/docs"
enableRobotsTXT = true
enableGitInfo = false

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsStyle = "tango"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"

[params]
  copyright = "Keystone Core Project"
  privacy_policy = ""

  # Repository
  github_repo = "https://github.com/shawnbutts/keystone-core"
  github_branch = "main"

  # Mermaid diagram support
  [params.mermaid]
    enable = true
    theme = "default"

  # UI
  [params.ui]
    sidebar_menu_compact = true
    breadcrumb_disable = false
    sidebar_search_disable = false
    navbar_logo = true
    footer_about_enable = false

    [params.ui.feedback]
      enable = false

  # Links
  [[params.links.user]]
    name = "GitHub"
    url = "https://github.com/shawnbutts/keystone-core"
    icon = "fab fa-github"
    desc = "Development takes place here!"

  [[params.links.developer]]
    name = "GitHub"
    url = "https://github.com/shawnbutts/keystone-core"
    icon = "fab fa-github"
    desc = "Contribute to the project!"

[menu]
  [[menu.main]]
    name = "Documentation"
    weight = 1
    url = "/docs/"

  [[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/shawnbutts/keystone-core"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
