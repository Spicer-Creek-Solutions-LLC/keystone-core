# Woodpecker CI for the Codeberg mirror.
#
# All steps run through Make targets per PROJECT-DETAILS §5.4.
# Steps with `depends_on: []` execute in parallel.
#
# Cross-build matrix lives in .woodpecker/build.yml — Woodpecker's
# matrix scopes to a whole workflow, so the cross-build is split out
# rather than re-running lint/test/smoke five times.

when:
  - event: push
    branch: main
  - event: pull_request

# Sidecar Postgres for the integration step. Reachable from other steps
# at hostname `postgres` on the default Postgres port.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kscore
      POSTGRES_PASSWORD: kscore
      POSTGRES_DB: kscore_test

steps:
  # Build golangci-lint with the runner's Go toolchain so the binary's
  # build-time Go version matches go.mod's `go` directive. Avoids the
  # "Go language version (goX.Y) used to build golangci-lint is lower
  # than the targeted Go version" error from prebuilt binaries.
  lint:
    image: golang:1.26
    depends_on: []
    commands:
      - make install-tools
      - export PATH=/go/bin:$PATH
      - make lint

  test:
    image: golang:1.26
    depends_on: []
    commands:
      - make test-coverage

  integration:
    image: golang:1.26
    depends_on: []
    environment:
      KSCORE_TEST_POSTGRES_DSN: postgres://kscore:kscore@postgres:5432/kscore_test?sslmode=disable
    commands:
      - make test-integration

  smoke:
    image: golang:1.26
    depends_on: []
    commands:
      - make smoke

  proto:
    image: golang:1.26
    depends_on: []
    commands:
      - go install github.com/bufbuild/buf/cmd/buf@latest
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - export PATH=/go/bin:$PATH
      - make proto-lint
      - make proto
      - git diff --exit-code
      - make proto-breaking
